plugins {
    id 'java'
    id 'edu.sc.seis.launch4j' version '4.0.0'
}

// Version of the Evade Launcher itself (independent of the mod version it installs). THE one place it is set: the
// build stamps it into the jar manifest, the .exe's file info and launcher.properties (read by LauncherInfo.VERSION for
// User-Agents, About, What's new and the self-update's "never older" check), and scripts/build-site.sh reads it from here
// for version.json and the download page. The files keep their old installer names (Evade-Installer.exe,
// EvadeInstaller.jar) so existing downloads and self-update keep working.
version = '2.7.2'

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('net/evadeclient/installer/launcher.properties') { expand version: project.version }
}

repositories { mavenCentral() }

dependencies {
    implementation 'com.google.code.gson:gson:2.15.0'
    // Evade Clips is built in: one jar/exe runs the launcher and the clip recorder (tray, control server, editor).
    implementation project(':clips')
    // WebP decoding for Modrinth's mod icons (TwelveMonkeys ImageIO 3.15.3, BSD-3-Clause). Kept in installer/libs
    // (checked against Maven Central's SHA-1s) so the build works offline.
    implementation files(fileTree(dir: 'libs', include: '*.jar'))

    // Unit tests for the launcher's pure logic (`./gradlew :installer:test`): share codes, modpacks, crash help, log
    // masking, servers.dat, updates and pins, zip paths, Safe Start.
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // The launcher's code is headless-safe in these tests; keep AWT from looking for a display on CI.
    systemProperty 'java.awt.headless', 'true'
    // Download tests serve files from 127.0.0.1, outside the launcher's download host list.
    systemProperty 'evade.test.loopbackDownloads', 'true'
    testLogging { events 'failed'; exceptionFormat 'full' }
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }

// The jar's entry point (Boot) is built for Java 8 so that opening the jar with an old Java shows a clear
// "needs Java 17" message instead of failing silently. Everything else stays Java 17.
sourceSets { boot { java { srcDir 'src/boot/java' } } }
tasks.named('compileBootJava') { options.release = 8; options.compilerArgs += ['-Xlint:-options'] }

// Single self-contained jar: Gson and Evade Clips (with FlatLaf, JNativeHook, ZXing) are bundled so it runs with just `java -jar`.
tasks.named('jar') {
    archiveFileName = 'EvadeInstaller.jar'
    from sourceSets.boot.output
    manifest { attributes 'Main-Class': 'net.evadeclient.installer.Boot', 'Implementation-Version': project.version }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/9/module-info.class', 'module-info.class'
    // Dev-only code stays out of the release jar/exe: the launcher's screenshot renderers (run them with
    // `./gradlew :installer:screenshots`) and Evade Clips' self-tests (`./gradlew :clips:selfTest` etc. use the Clips jar).
    exclude 'net/evadeclient/installer/Screenshots*.class', 'net/evadeclient/installer/*Shots.class', 'net/evadeclient/installer/*Shots$*.class',
            'net/evadeclient/clips/SelfTest*.class', 'net/evadeclient/clips/EditTests*.class', 'net/evadeclient/clips/SizeTest*.class',
            'net/evadeclient/clips/RegressionSupport*.class', 'net/evadeclient/clips/ui/Screenshots.class', 'net/evadeclient/clips/ui/Screenshots$*.class'
}

// `./gradlew :installer:screenshots -Pout=dir` renders every launcher page with sample data (dev only: these classes
// aren't in the release jar). -Devade.shots.only=content|look|v25|shaders picks one set.
tasks.register('screenshots', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.evadeclient.installer.EvadeInstaller'
    args '--screenshots', (project.findProperty('out') ?: "${buildDir}/screenshots")
    systemProperty 'java.awt.headless', 'true'
    if (project.hasProperty('only')) systemProperty 'evade.shots.only', project.property('only')
}

// Windows .exe wrapper around the jar. It looks for Java in the places the Minecraft Launcher installs
// its own runtime, so most players don't need to install Java separately.
launch4j {
    mainClassName = 'net.evadeclient.installer.EvadeInstaller'
    jarTask = tasks.named('jar').get()
    outfile = 'Evade-Installer.exe'
    icon = "${projectDir}/evade.ico"
    headerType = 'gui'
    productName = 'Evade Launcher'
    fileDescription = 'Evade Launcher'
    companyName = 'Evade Client'
    copyright = 'Evade Client'
    version = project.version
    textVersion = project.version
    internalName = 'EvadeInstaller'
    jreMinVersion = '17'
    requires64Bit = true
    // Launch4j caps this at 260 chars: the Minecraft Launcher's Java 21 runtime (Store/new and classic installs),
    // then JAVA_HOME. If none match, Launch4j also searches installed JREs before showing the message below.
    bundledJrePath = [
        '%LOCALAPPDATA%\\Packages\\Microsoft.4297127D64EC6_8wekyb3d8bbwe\\LocalCache\\Local\\runtime\\java-runtime-delta\\windows-x64\\java-runtime-delta',
        '%APPDATA%\\.minecraft\\runtime\\java-runtime-delta\\windows-x64\\java-runtime-delta',
        '%JAVA_HOME%'
    ].join(';')
    downloadUrl = 'https://adoptium.net/temurin/releases/?version=21'
    messagesJreNotFoundError = 'Evade Launcher needs Java 17 or newer, and Minecraft 1.21.11 needs Java 21. Open the Minecraft Launcher once (it installs Java 21), or install Java 21 from adoptium.net.'
}
