<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plumb &amp; Square</title>
<meta name="description" content="Free kitchen and bath design tool: measure, design, code checks, 3D, estimates and client presentations.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 26 26%27%3E%3Crect x=%271.5%27 y=%271.5%27 width=%2723%27 height=%2723%27 rx=%273%27 fill=%27%23fff%27 stroke=%27%231b262d%27 stroke-width=%272%27/%3E%3Cpath d=%27M6 20V6h14%27 fill=%27none%27 stroke=%27%23f0b400%27 stroke-width=%272.6%27/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky toolbar + tab strip over a working surface; Design = catalog | plan | inspector, stacking to one column on phones. */
:root{
  --paper:#e9ece8; --panel:#f8f9f6; --panel2:#eff2ee; --ink:#1b262d; --muted:#57656d; --line:#cbd2cc; --line2:#aab4ad;
  --accent:#f0b400; --accent-ink:#6f4c00; --on-accent:#1b1a14; --blue:#22608f; --blue-soft:rgba(34,96,143,.12);
  --err:#c23d26; --warn:#a96f00; --ok:#2b7650; --info:#4d6c83;
  --err-soft:rgba(194,61,38,.11); --warn-soft:rgba(169,111,0,.12); --ok-soft:rgba(43,118,80,.11); --info-soft:rgba(77,108,131,.11);
  --cab:#fffefb; --cab-stroke:#2f3e47; --wallcab:rgba(34,96,143,.07); --tall:#dde3de; --app:#cdd5d9; --isl:#f5ecd9; --floor:#f6f7f3; --wallfill:#36444c; --ct:#e4e2dc; --hatch:#9aa59f; --dim:#2f3e47;
  --f-disp:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --f-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --ts:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121719; --panel:#1a2125; --panel2:#20282d; --ink:#e2e8e4; --muted:#93a2a9; --line:#2d383e; --line2:#3e4b52;
  --accent:#f2b705; --accent-ink:#f5c842; --on-accent:#16140c; --blue:#6aa7d9; --blue-soft:rgba(106,167,217,.16);
  --err:#ff6e52; --warn:#f0b429; --ok:#4cc38a; --info:#8fb3cc;
  --err-soft:rgba(255,110,82,.14); --warn-soft:rgba(240,180,41,.14); --ok-soft:rgba(76,195,138,.13); --info-soft:rgba(143,179,204,.13);
  --cab:#26313a; --cab-stroke:#c9d4d8; --wallcab:rgba(106,167,217,.10); --tall:#33404a; --app:#3b4850; --isl:#3a3426; --floor:#182024; --wallfill:#8c9ba3; --ct:#3a4248; --hatch:#5f6d74; --dim:#c3cfd4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121719; --panel:#1a2125; --panel2:#20282d; --ink:#e2e8e4; --muted:#93a2a9; --line:#2d383e; --line2:#3e4b52;
  --accent:#f2b705; --accent-ink:#f5c842; --on-accent:#16140c; --blue:#6aa7d9; --blue-soft:rgba(106,167,217,.16);
  --err:#ff6e52; --warn:#f0b429; --ok:#4cc38a; --info:#8fb3cc;
  --err-soft:rgba(255,110,82,.14); --warn-soft:rgba(240,180,41,.14); --ok-soft:rgba(76,195,138,.13); --info-soft:rgba(143,179,204,.13);
  --cab:#26313a; --cab-stroke:#c9d4d8; --wallcab:rgba(106,167,217,.10); --tall:#33404a; --app:#3b4850; --isl:#3a3426; --floor:#182024; --wallfill:#8c9ba3; --ct:#3a4248; --hatch:#5f6d74; --dim:#c3cfd4;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:calc(14px * var(--ts));line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:700;font-size:calc(21px * var(--ts));letter-spacing:.02em;white-space:nowrap}
.brand svg{flex:none}
.pname{flex:1 1 160px;min-width:0;border:1px solid transparent;background:transparent;border-radius:var(--r);padding:5px 8px;font-weight:600}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--panel2)}
.bar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);padding:6px 11px;font-weight:500;white-space:nowrap;min-height:34px}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.pri:hover{filter:brightness(.96)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 8px;min-height:28px;font-size:calc(13px * var(--ts))}
.btn.danger{color:var(--err)}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;min-height:32px;font-size:calc(13px * var(--ts));font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.save{font-size:calc(12px * var(--ts));color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:9px 12px 10px;font-family:var(--f-disp);font-weight:600;font-size:calc(17px * var(--ts));letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;font:600 calc(12px * var(--ts))/18px var(--f-mono);text-align:center;margin-left:4px;vertical-align:2px}
.b-err{background:var(--err);color:#fff}.b-warn{background:var(--warn);color:var(--on-accent)}.b-ok{background:var(--ok);color:#fff}

main{padding-block:14px 40px}
.view[hidden]{display:none!important}
h2{font-family:var(--f-disp);font-weight:700;font-size:calc(24px * var(--ts));letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font-family:var(--f-disp);font-weight:600;font-size:calc(18px * var(--ts));letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--ink)}
.eyebrow{font:600 calc(11px * var(--ts))/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.hint{font-size:calc(12.5px * var(--ts));color:var(--muted);max-width:68ch}
label.f{display:flex;flex-direction:column;gap:3px;font-size:calc(12px * var(--ts));color:var(--muted);font-weight:500;min-width:0}
input.in,select.in,textarea.in{border:1px solid var(--line2);background:var(--panel);border-radius:5px;padding:6px 8px;min-height:34px;width:100%;color:var(--ink);font-size:calc(14px * var(--ts))}
input.in.len{font-family:var(--f-mono)}
input.in:focus,select.in:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
input.in.laser-target{box-shadow:0 0 0 3px rgba(240,180,0,.45);border-color:var(--accent)}
.tw{overflow-x:auto;min-width:0}
table.t{border-collapse:collapse;width:100%;font-size:calc(13px * var(--ts))}
table.t th{font:600 calc(11px * var(--ts))/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t input.in{min-height:30px;padding:4px 6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:calc(12px * var(--ts));font-weight:600;white-space:nowrap}
.p-err{background:var(--err-soft);color:var(--err)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-ok{background:var(--ok-soft);color:var(--ok)}.p-info{background:var(--info-soft);color:var(--info)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:calc(13px * var(--ts))}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--f-mono);text-align:right}

/* measure */
.mgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.mini{width:100%;aspect-ratio:4/3;max-width:100%;background:var(--floor);border:1px solid var(--line);border-radius:8px;display:block}
.laser{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--panel2);border:1px dashed var(--line2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line2);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}

/* design */
.dgrid{display:grid;grid-template-columns:200px minmax(0,1fr) 300px;gap:12px;align-items:start}
.cat{display:flex;flex-direction:column;gap:10px}
.cat .grp{display:flex;flex-direction:column;gap:4px}
.cbtn{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 8px;font-size:calc(13px * var(--ts))}
.cbtn:hover{border-color:var(--blue);background:var(--blue-soft)}
.cbtn small{font-family:var(--f-mono);color:var(--muted);font-size:calc(11px * var(--ts))}
.planwrap{position:relative;background:var(--floor);border:1px solid var(--line);border-radius:8px;overflow:hidden;height:calc(100dvh - 190px);min-height:420px}
.planwrap svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ptools{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;right:8px;pointer-events:none}
.ptools>*{pointer-events:auto}
.ptools .btn,.ptools .seg,.ptools select{background:var(--panel)}
.legend{position:absolute;left:8px;bottom:8px;display:flex;gap:10px;font-size:calc(11px * var(--ts));color:var(--muted);background:var(--panel);padding:4px 8px;border-radius:5px;border:1px solid var(--line);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border:1px solid var(--cab-stroke);margin-right:4px;vertical-align:-1px}
.insp .in{font-size:calc(13px * var(--ts))}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.issue{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;width:100%}
.issue:hover{border-color:var(--line2)}
.issue .sev{flex:none;width:4px;align-self:stretch;border-radius:2px}
.sev-err{background:var(--err)}.sev-warn{background:var(--warn)}.sev-info{background:var(--info)}.sev-ok{background:var(--ok)}
.issue b{display:block;font-weight:600;font-size:calc(13.5px * var(--ts))}
.issue span{font-size:calc(12.5px * var(--ts));color:var(--muted)}
.runbar{display:flex;height:16px;border-radius:3px;overflow:hidden;border:1px solid var(--line2);background:var(--panel2)}

/* plan svg classes */
.pl-floor{fill:var(--floor)}
.pl-wall{fill:var(--wallfill)}
.pl-wl{font:500 calc(5px * var(--ts)) var(--f-mono);fill:var(--muted)}
.pl-ang{font:600 calc(4.6px * var(--ts)) var(--f-mono);fill:var(--err)}
.pl-it{stroke:var(--cab-stroke);stroke-width:.6;cursor:grab}
.pl-base{fill:var(--cab)}.pl-wallc{fill:var(--wallcab);stroke-dasharray:2 1.2}.pl-tall{fill:var(--tall)}.pl-app{fill:var(--app)}.pl-isl{fill:var(--isl)}.pl-fill{fill:var(--hatch)}
.pl-ct{fill:none;stroke:var(--cab-stroke);stroke-width:.35;stroke-dasharray:1 1;opacity:.6;pointer-events:none}
.pl-lbl{font:500 calc(4px * var(--ts)) var(--f-mono);fill:var(--ink);pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.pl-sel{stroke:var(--blue);stroke-width:1.6}
.pl-e{stroke:var(--err);stroke-width:1.4}.pl-w{stroke:var(--warn);stroke-width:1.2}
.pl-u{font:700 calc(3.6px * var(--ts)) var(--f-mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pl-tri{fill:rgba(240,180,0,.10);stroke:var(--accent);stroke-width:.8;stroke-dasharray:3 2;pointer-events:none}
.pl-clr{stroke:var(--blue);stroke-width:.5;pointer-events:none}
.pl-clrt{font:600 calc(4px * var(--ts)) var(--f-mono);fill:var(--blue);text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:var(--floor);stroke-width:1.6}
.pl-clr.bad{stroke:var(--err)}.pl-clrt.bad{fill:var(--err)}
.pl-seat{fill:none;stroke:var(--muted);stroke-width:.5;pointer-events:none}

/* elevation */
.elwrap{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto;min-width:0}
.elwrap svg{display:block;width:100%;min-width:640px;height:auto}
/* elevation drawings stay on white paper in both themes, like a printed shop drawing */
.el text{font-family:var(--f-mono);fill:#1d2930}
.el .wbg{fill:#fbfbf9;stroke:#1d2930;stroke-width:.5}
.el .bx{fill:#fff;stroke:#1d2930;stroke-width:.45}
.el .fr{fill:#fff;stroke:#1d2930;stroke-width:.35}
.el .sw{fill:none;stroke:#7d8a91;stroke-width:.25;stroke-dasharray:1.5 1}
.el .toe{fill:#e6e8e5;stroke:#1d2930;stroke-width:.3}
.el .ctop{fill:#d9d6cf;stroke:#1d2930;stroke-width:.4}
.el .bs{fill:url(#tile)}
.el .app{fill:#eceff0;stroke:#1d2930;stroke-width:.45}
.el .dark{fill:#3a4247;stroke:#1d2930;stroke-width:.3}
.el .side{fill:url(#hatch);stroke:#1d2930;stroke-width:.35}
.el .win{fill:#e6f0f6;stroke:#1d2930;stroke-width:.4}
.el .trim{fill:#fff;stroke:#1d2930;stroke-width:.3}
.el .sof{fill:url(#hatch);stroke:#1d2930;stroke-width:.4}
.el .dl{stroke:#1d2930;stroke-width:.25;fill:none}
.el .ut{stroke:#b53a22;stroke-width:.4;fill:#fff}
.el .utt{fill:#b53a22;font-weight:600}
.el .cl{stroke:#b53a22;stroke-width:.25;stroke-dasharray:2 1}

/* 3d */
.v3wrap{position:relative;height:calc(100dvh - 200px);min-height:420px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#1d2327}
.v3wrap canvas{display:block;width:100%;height:100%;touch-action:none}
.v3tools{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap}
.v3tools .btn,.v3tools .seg,.v3tools select{background:var(--panel)}
.joy{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px}
.joy button{border:1px solid rgba(255,255,255,.3);background:rgba(20,24,27,.6);color:#fff;border-radius:8px;font-size:calc(18px * var(--ts))}
.finish{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.sw-row{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line2)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--blue)}

/* estimate */
.egrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.tot{display:flex;flex-direction:column;gap:6px}
.tot .l{display:flex;justify-content:space-between;gap:10px;font-size:calc(13.5px * var(--ts))}
.tot .l span:last-child{font-family:var(--f-mono)}
.tot .g{border-top:2px solid var(--ink);padding-top:8px;font-weight:700;font-size:calc(17px * var(--ts))}
tr.grp td{background:var(--panel2);font:600 calc(11px * var(--ts)) var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.doc{background:#fff;color:#1d2930;border:1px solid var(--line);border-radius:8px;padding:clamp(16px,4vw,44px);max-width:880px}
.doc h1{font-family:var(--f-disp);font-size:calc(34px * var(--ts));margin:0 0 4px;letter-spacing:.02em}
.doc table{border-collapse:collapse;width:100%;font-size:calc(13px * var(--ts))}
.doc td,.doc th{padding:6px 6px;border-bottom:1px solid #d8dcd8;text-align:left}
.doc .n{text-align:right;font-family:var(--f-mono)}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px}
.doc .sig div{border-top:1px solid #1d2930;padding-top:6px;font-size:calc(12px * var(--ts))}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-size:calc(13.5px * var(--ts));z-index:50;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--err);color:#fff}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:240px;z-index:40;display:flex;flex-direction:column}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:5px}
.menu button:hover{background:var(--panel2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .pl{max-height:220px;overflow:auto;display:flex;flex-direction:column}

@media (max-width:1100px){.dgrid{grid-template-columns:minmax(0,1fr) 290px}.dgrid .cat{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.dgrid .cat .grp{flex:1 1 180px}}
@media (max-width:820px){
  .mgrid,.egrid{grid-template-columns:minmax(0,1fr)}
  .dgrid{grid-template-columns:minmax(0,1fr)}
  .planwrap{height:auto;display:flex;flex-direction:column}
  .planwrap svg{height:58vh!important;min-height:340px}
  .ptools{position:static;padding:8px;border-bottom:1px solid var(--line);background:var(--panel)}
  .legend{display:none}
  .v3wrap{height:auto;display:flex;flex-direction:column}
  .v3wrap canvas{height:56vh!important;min-height:320px}
  .v3tools{position:static;padding:8px;background:var(--panel);border-bottom:1px solid var(--line);gap:5px}
  .v3tools .btn{min-height:30px;padding:3px 8px;font-size:calc(12.5px * var(--ts))}
  #paper{top:auto;height:56vh}
  .dgrid .cat{order:3}
  .mgrid>.stack:last-child{order:-1;position:static!important}
  .egrid>.stack:last-child{position:static!important}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .top,.noprint,.tabs{display:none!important}
  body,html{background:#fff}
  .view{display:none!important}
  #printArea{display:block!important}
}
#printArea{display:none}
.pl-dim{stroke:var(--dim);stroke-width:.35;fill:none;pointer-events:none}
.pl-dimt{font:500 calc(3.4px * var(--ts)) var(--f-mono);fill:var(--dim);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pl-note rect{fill:#fff7d1;stroke:#c9a227;stroke-width:.4;cursor:move}
.pl-note.sel rect{stroke:var(--blue);stroke-width:1}
.pl-note text{font:500 calc(3.4px * var(--ts)) var(--f-ui);fill:#3d3418}
.meter{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%}
.docrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.dthumb{width:52px;height:40px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex:none}
.dext{display:grid;place-items:center;font:600 calc(11px * var(--ts)) var(--f-mono);background:var(--panel2);color:var(--muted)}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.caps figure{margin:0}.caps img{width:100%;border-radius:6px;display:block;border:1px solid var(--line)}
.caps figcaption{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:calc(12px * var(--ts));color:var(--muted);margin-top:4px;flex-wrap:wrap}
#paper{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.85}
.paintbar{position:absolute;left:8px;right:8px;bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-radius:8px;background:rgba(20,24,27,.78)}
.paintbar .swatch{border-color:rgba(255,255,255,.6)}

/* ---------- easy mode: bigger targets, plainer chrome, more contrast ---------- */
:root[data-mode="simple"] .pro{display:none!important}
:root[data-mode="simple"]{--muted:#46535b}
@media (prefers-color-scheme: dark){:root[data-mode="simple"]:not([data-theme="light"]){--muted:#b3c0c6}}
:root[data-mode="simple"][data-theme="dark"]{--muted:#b3c0c6}
:root[data-mode="simple"] .btn{min-height:44px;padding:8px 14px}
:root[data-mode="simple"] .btn.sm{min-height:40px;padding:6px 12px}
:root[data-mode="simple"] input.in,:root[data-mode="simple"] select.in{min-height:44px;font-size:max(16px,calc(14px * var(--ts)))}
:root[data-mode="simple"] .seg button{min-height:40px;padding:6px 12px}
:root[data-mode="simple"] .hint{color:var(--ink);opacity:.82}
.tab .ti{display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);font:700 calc(13px * var(--ts)) var(--f-ui);margin-right:6px;vertical-align:1px}
.tab[aria-selected="true"] .ti{background:var(--accent);color:var(--on-accent);border-color:transparent}
.tab.extra{font-size:calc(15px * var(--ts))}
.tabsep{width:1px;background:var(--line2);margin:10px 6px;flex:none}
.guide{display:block;background:var(--blue-soft);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:8px;padding:12px 16px;margin-bottom:14px}
.guide ol{margin:4px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:3px;font-size:calc(15px * var(--ts));max-width:80ch}
.guide h3{font-size:calc(19px * var(--ts))}
.guide summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.guide summary::-webkit-details-marker{display:none}
.guide .gtog{font-weight:600;color:var(--blue);font-size:calc(14px * var(--ts))}
.guide .gtog::after{content:" ▾"}.guide[open] .gtog::after{content:" ▴"}
.guide .gbody{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.guide .x{flex:none}
@media (max-width:640px){.hdr-opt,#saveState{display:none!important}.guide{padding:10px 12px}.guide h3{font-size:calc(17px * var(--ts))}}
.guide-mini{margin-bottom:10px}
.nextbar{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.nextbar .btn{min-height:52px;font-size:calc(17px * var(--ts));padding:10px 20px}
.welcome{position:fixed;inset:0;z-index:60;background:rgba(15,20,23,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.welcome .box{background:var(--panel);color:var(--ink);border-radius:14px;max-width:760px;width:100%;padding:clamp(18px,4vw,36px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.welcome h2{font-size:calc(30px * var(--ts))}
.wchoices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin:18px 0}
.wchoice{display:flex;flex-direction:column;gap:6px;text-align:left;border:2px solid var(--line2);background:var(--panel);border-radius:10px;padding:16px;min-height:120px}
.wchoice:hover,.wchoice:focus-visible{border-color:var(--blue);background:var(--blue-soft)}
.wchoice b{font-size:calc(18px * var(--ts))}
.wchoice span{color:var(--muted);font-size:calc(14px * var(--ts))}
.wchoice .big{font-size:calc(30px * var(--ts));line-height:1}
.toast .tbtn{margin-left:12px;background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;padding:6px 12px;font-weight:700}
.cbtn .ci{flex:none;display:inline-grid;place-items:center;width:34px;height:28px}
.cbtn .ci svg{width:34px;height:28px}
.cbtn .cn{flex:1;min-width:0}
details.card>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"Show ▾";font-size:calc(13px * var(--ts));color:var(--blue);font-weight:600;white-space:nowrap}
details.card[open]>summary::after{content:"Hide ▴"}
.helpbtn{font-weight:700}
</style>

<div id="app">
  <header class="top">
    <div class="bar wrap">
      <div class="brand" title="Plumb &amp; Square">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1.5" y="1.5" width="23" height="23" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 20V6h14" fill="none" stroke="var(--accent)" stroke-width="2.6"/><path d="M15 9v8" stroke="currentColor" stroke-width="1.4"/><path d="M13 17h4l-2 3z" fill="currentColor"/></svg>
        <span>Plumb &amp; Square</span>
      </div>
      <input id="pname" class="pname" aria-label="Project name" data-bind="name" data-kind="text">
      <span class="save" id="saveState">Saved on this device</span>
      <div class="sp"></div>
      <button class="btn sm" id="bUndo" data-act="undo" title="Undo the last change (Ctrl+Z)">↶ Undo</button>
      <button class="btn ghost sm pro" id="bRedo" data-act="redo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
      <div class="seg hdr-opt" role="group" aria-label="Text size" title="Text size"><button data-act="tsize" data-v="1" id="ts1" style="font-size:13px">A</button><button data-act="tsize" data-v="1.15" id="ts2" style="font-size:16px">A</button><button data-act="tsize" data-v="1.3" id="ts3" style="font-size:19px">A</button></div>
      <div class="seg hdr-opt" role="group" aria-label="Screen mode" title="Simple shows the everyday tools. Full shows everything."><button data-act="mode" data-v="simple" id="mSimple">Simple</button><button data-act="mode" data-v="full" id="mFull">Full</button></div>
      <button class="btn sm helpbtn" data-act="home" title="Start screen and help">? Help</button>
      <div class="seg pro" role="group" aria-label="Units">
        <button data-act="units" data-v="in" id="uIn">in</button><button data-act="units" data-v="mm" id="uMm">mm</button>
      </div>
      <div style="position:relative">
        <button class="btn" data-act="menu" id="bMenu" aria-haspopup="true">Saved jobs ▾</button>
        <div class="menu" id="menu" hidden></div>
      </div>
    </div>
    <nav class="tabs wrap" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="measure"><span class="ti">1</span>Measure room</button>
      <button class="tab" role="tab" data-tab="design"><span class="ti">2</span>Place cabinets</button>
      <button class="tab" role="tab" data-tab="view3d"><span class="ti">3</span>See it in 3D</button>
      <button class="tab" role="tab" data-tab="checks"><span class="ti">4</span>Problems <span id="chkBadge"></span></button>
      <button class="tab" role="tab" data-tab="estimate"><span class="ti">5</span>Price &amp; quote</button>
      <span class="tabsep" aria-hidden="true"></span>
      <button class="tab extra" role="tab" data-tab="elevations">Wall drawings</button>
      <button class="tab extra" role="tab" data-tab="present">Show the client</button>
      <button class="tab extra" role="tab" data-tab="docs">Files &amp; specs</button>
    </nav>
  </header>

  <main class="wrap">
    <div id="guide"></div>
    <section class="view" id="v-measure"></section>
    <section class="view" id="v-design"></section>
    <section class="view" id="v-elevations"></section>
    <section class="view" id="v-view3d">
      <div class="v3wrap" id="v3wrap">
        <canvas id="c3d" aria-label="3D view of the kitchen"></canvas>
        <div id="paper" hidden></div>
        <div class="v3tools" id="v3tools"></div>
        <div class="paintbar" id="paintbar" hidden></div>
        <div class="joy" id="joy" hidden>
          <span></span><button data-mv="f" aria-label="Walk forward">▲</button><span></span>
          <button data-mv="l" aria-label="Step left">◀</button><button data-mv="b" aria-label="Walk back">▼</button><button data-mv="r" aria-label="Step right">▶</button>
        </div>
        <div id="no3d" hidden style="position:absolute;inset:0;display:grid;place-items:center;color:#dfe6e2;padding:20px;text-align:center"></div>
      </div>
      <div class="card" style="margin-top:12px">
        <h3>Colors &amp; materials</h3>
        <div class="finish" id="finishes"></div>
      </div>
    </section>
    <section class="view" id="v-estimate"></section>
    <section class="view" id="v-docs"></section>
    <section class="view" id="v-present"></section>
    <section class="view" id="v-checks"></section>
    <div id="nextbar"></div>
  </main>
  <div id="printArea"></div>
</div>
