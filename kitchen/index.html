<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plumb &amp; Square</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky toolbar + tab strip over a working surface; Design = catalog | plan | inspector, stacking to one column on phones. */
:root{
  --paper:#e9ece8; --panel:#f8f9f6; --panel2:#eff2ee; --ink:#1b262d; --muted:#57656d; --line:#cbd2cc; --line2:#aab4ad;
  --accent:#f0b400; --accent-ink:#6f4c00; --on-accent:#1b1a14; --blue:#22608f; --blue-soft:rgba(34,96,143,.12);
  --err:#c23d26; --warn:#a96f00; --ok:#2b7650; --info:#4d6c83;
  --err-soft:rgba(194,61,38,.11); --warn-soft:rgba(169,111,0,.12); --ok-soft:rgba(43,118,80,.11); --info-soft:rgba(77,108,131,.11);
  --cab:#fffefb; --cab-stroke:#2f3e47; --wallcab:rgba(34,96,143,.07); --tall:#dde3de; --app:#cdd5d9; --isl:#f5ecd9; --floor:#f6f7f3; --wallfill:#36444c; --ct:#e4e2dc; --hatch:#9aa59f; --dim:#2f3e47;
  --f-disp:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --f-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121719; --panel:#1a2125; --panel2:#20282d; --ink:#e2e8e4; --muted:#93a2a9; --line:#2d383e; --line2:#3e4b52;
  --accent:#f2b705; --accent-ink:#f5c842; --on-accent:#16140c; --blue:#6aa7d9; --blue-soft:rgba(106,167,217,.16);
  --err:#ff6e52; --warn:#f0b429; --ok:#4cc38a; --info:#8fb3cc;
  --err-soft:rgba(255,110,82,.14); --warn-soft:rgba(240,180,41,.14); --ok-soft:rgba(76,195,138,.13); --info-soft:rgba(143,179,204,.13);
  --cab:#26313a; --cab-stroke:#c9d4d8; --wallcab:rgba(106,167,217,.10); --tall:#33404a; --app:#3b4850; --isl:#3a3426; --floor:#182024; --wallfill:#8c9ba3; --ct:#3a4248; --hatch:#5f6d74; --dim:#c3cfd4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121719; --panel:#1a2125; --panel2:#20282d; --ink:#e2e8e4; --muted:#93a2a9; --line:#2d383e; --line2:#3e4b52;
  --accent:#f2b705; --accent-ink:#f5c842; --on-accent:#16140c; --blue:#6aa7d9; --blue-soft:rgba(106,167,217,.16);
  --err:#ff6e52; --warn:#f0b429; --ok:#4cc38a; --info:#8fb3cc;
  --err-soft:rgba(255,110,82,.14); --warn-soft:rgba(240,180,41,.14); --ok-soft:rgba(76,195,138,.13); --info-soft:rgba(143,179,204,.13);
  --cab:#26313a; --cab-stroke:#c9d4d8; --wallcab:rgba(106,167,217,.10); --tall:#33404a; --app:#3b4850; --isl:#3a3426; --floor:#182024; --wallfill:#8c9ba3; --ct:#3a4248; --hatch:#5f6d74; --dim:#c3cfd4;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:700;font-size:21px;letter-spacing:.02em;white-space:nowrap}
.brand svg{flex:none}
.pname{flex:1 1 160px;min-width:0;border:1px solid transparent;background:transparent;border-radius:var(--r);padding:5px 8px;font-weight:600}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--panel2)}
.bar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);padding:6px 11px;font-weight:500;white-space:nowrap;min-height:34px}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.pri:hover{filter:brightness(.96)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 8px;min-height:28px;font-size:13px}
.btn.danger{color:var(--err)}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;min-height:32px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:9px 12px 10px;font-family:var(--f-disp);font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;font:600 12px/18px var(--f-mono);text-align:center;margin-left:4px;vertical-align:2px}
.b-err{background:var(--err);color:#fff}.b-warn{background:var(--warn);color:var(--on-accent)}.b-ok{background:var(--ok);color:#fff}

main{padding-block:14px 40px}
.view[hidden]{display:none!important}
h2{font-family:var(--f-disp);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font-family:var(--f-disp);font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--ink)}
.eyebrow{font:600 11px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.hint{font-size:12.5px;color:var(--muted);max-width:68ch}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
input.in,select.in,textarea.in{border:1px solid var(--line2);background:var(--panel);border-radius:5px;padding:6px 8px;min-height:34px;width:100%;color:var(--ink);font-size:14px}
input.in.len{font-family:var(--f-mono)}
input.in:focus,select.in:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
input.in.laser-target{box-shadow:0 0 0 3px rgba(240,180,0,.45);border-color:var(--accent)}
.tw{overflow-x:auto;min-width:0}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{font:600 11px/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t input.in{min-height:30px;padding:4px 6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.p-err{background:var(--err-soft);color:var(--err)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-ok{background:var(--ok-soft);color:var(--ok)}.p-info{background:var(--info-soft);color:var(--info)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--f-mono);text-align:right}

/* measure */
.mgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.mini{width:100%;aspect-ratio:4/3;max-width:100%;background:var(--floor);border:1px solid var(--line);border-radius:8px;display:block}
.laser{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--panel2);border:1px dashed var(--line2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line2);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}

/* design */
.dgrid{display:grid;grid-template-columns:200px minmax(0,1fr) 300px;gap:12px;align-items:start}
.cat{display:flex;flex-direction:column;gap:10px}
.cat .grp{display:flex;flex-direction:column;gap:4px}
.cbtn{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 8px;font-size:13px}
.cbtn:hover{border-color:var(--blue);background:var(--blue-soft)}
.cbtn small{font-family:var(--f-mono);color:var(--muted);font-size:11px}
.planwrap{position:relative;background:var(--floor);border:1px solid var(--line);border-radius:8px;overflow:hidden;height:calc(100dvh - 190px);min-height:420px}
.planwrap svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ptools{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;right:8px;pointer-events:none}
.ptools>*{pointer-events:auto}
.ptools .btn,.ptools .seg,.ptools select{background:var(--panel)}
.legend{position:absolute;left:8px;bottom:8px;display:flex;gap:10px;font-size:11px;color:var(--muted);background:var(--panel);padding:4px 8px;border-radius:5px;border:1px solid var(--line);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border:1px solid var(--cab-stroke);margin-right:4px;vertical-align:-1px}
.insp .in{font-size:13px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.issue{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;width:100%}
.issue:hover{border-color:var(--line2)}
.issue .sev{flex:none;width:4px;align-self:stretch;border-radius:2px}
.sev-err{background:var(--err)}.sev-warn{background:var(--warn)}.sev-info{background:var(--info)}.sev-ok{background:var(--ok)}
.issue b{display:block;font-weight:600;font-size:13.5px}
.issue span{font-size:12.5px;color:var(--muted)}
.runbar{display:flex;height:16px;border-radius:3px;overflow:hidden;border:1px solid var(--line2);background:var(--panel2)}

/* plan svg classes */
.pl-floor{fill:var(--floor)}
.pl-wall{fill:var(--wallfill)}
.pl-wl{font:500 5px var(--f-mono);fill:var(--muted)}
.pl-ang{font:600 4.6px var(--f-mono);fill:var(--err)}
.pl-it{stroke:var(--cab-stroke);stroke-width:.6;cursor:grab}
.pl-base{fill:var(--cab)}.pl-wallc{fill:var(--wallcab);stroke-dasharray:2 1.2}.pl-tall{fill:var(--tall)}.pl-app{fill:var(--app)}.pl-isl{fill:var(--isl)}.pl-fill{fill:var(--hatch)}
.pl-ct{fill:none;stroke:var(--cab-stroke);stroke-width:.35;stroke-dasharray:1 1;opacity:.6;pointer-events:none}
.pl-lbl{font:500 4px var(--f-mono);fill:var(--ink);pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.pl-sel{stroke:var(--blue);stroke-width:1.6}
.pl-e{stroke:var(--err);stroke-width:1.4}.pl-w{stroke:var(--warn);stroke-width:1.2}
.pl-u{font:700 3.6px var(--f-mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pl-tri{fill:rgba(240,180,0,.10);stroke:var(--accent);stroke-width:.8;stroke-dasharray:3 2;pointer-events:none}
.pl-clr{stroke:var(--blue);stroke-width:.5;pointer-events:none}
.pl-clrt{font:600 4px var(--f-mono);fill:var(--blue);text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:var(--floor);stroke-width:1.6}
.pl-clr.bad{stroke:var(--err)}.pl-clrt.bad{fill:var(--err)}
.pl-seat{fill:none;stroke:var(--muted);stroke-width:.5;pointer-events:none}

/* elevation */
.elwrap{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto;min-width:0}
.elwrap svg{display:block;width:100%;min-width:640px;height:auto}
/* elevation drawings stay on white paper in both themes, like a printed shop drawing */
.el text{font-family:var(--f-mono);fill:#1d2930}
.el .wbg{fill:#fbfbf9;stroke:#1d2930;stroke-width:.5}
.el .bx{fill:#fff;stroke:#1d2930;stroke-width:.45}
.el .fr{fill:#fff;stroke:#1d2930;stroke-width:.35}
.el .sw{fill:none;stroke:#7d8a91;stroke-width:.25;stroke-dasharray:1.5 1}
.el .toe{fill:#e6e8e5;stroke:#1d2930;stroke-width:.3}
.el .ctop{fill:#d9d6cf;stroke:#1d2930;stroke-width:.4}
.el .bs{fill:url(#tile)}
.el .app{fill:#eceff0;stroke:#1d2930;stroke-width:.45}
.el .dark{fill:#3a4247;stroke:#1d2930;stroke-width:.3}
.el .side{fill:url(#hatch);stroke:#1d2930;stroke-width:.35}
.el .win{fill:#e6f0f6;stroke:#1d2930;stroke-width:.4}
.el .trim{fill:#fff;stroke:#1d2930;stroke-width:.3}
.el .sof{fill:url(#hatch);stroke:#1d2930;stroke-width:.4}
.el .dl{stroke:#1d2930;stroke-width:.25;fill:none}
.el .ut{stroke:#b53a22;stroke-width:.4;fill:#fff}
.el .utt{fill:#b53a22;font-weight:600}
.el .cl{stroke:#b53a22;stroke-width:.25;stroke-dasharray:2 1}

/* 3d */
.v3wrap{position:relative;height:calc(100dvh - 200px);min-height:420px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#1d2327}
.v3wrap canvas{display:block;width:100%;height:100%;touch-action:none}
.v3tools{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap}
.v3tools .btn,.v3tools .seg,.v3tools select{background:var(--panel)}
.joy{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px}
.joy button{border:1px solid rgba(255,255,255,.3);background:rgba(20,24,27,.6);color:#fff;border-radius:8px;font-size:18px}
.finish{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.sw-row{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line2)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--blue)}

/* estimate */
.egrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.tot{display:flex;flex-direction:column;gap:6px}
.tot .l{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.tot .l span:last-child{font-family:var(--f-mono)}
.tot .g{border-top:2px solid var(--ink);padding-top:8px;font-weight:700;font-size:17px}
tr.grp td{background:var(--panel2);font:600 11px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.doc{background:#fff;color:#1d2930;border:1px solid var(--line);border-radius:8px;padding:clamp(16px,4vw,44px);max-width:880px}
.doc h1{font-family:var(--f-disp);font-size:34px;margin:0 0 4px;letter-spacing:.02em}
.doc table{border-collapse:collapse;width:100%;font-size:13px}
.doc td,.doc th{padding:6px 6px;border-bottom:1px solid #d8dcd8;text-align:left}
.doc .n{text-align:right;font-family:var(--f-mono)}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px}
.doc .sig div{border-top:1px solid #1d2930;padding-top:6px;font-size:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:50;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--err);color:#fff}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:240px;z-index:40;display:flex;flex-direction:column}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:5px}
.menu button:hover{background:var(--panel2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .pl{max-height:220px;overflow:auto;display:flex;flex-direction:column}

@media (max-width:1100px){.dgrid{grid-template-columns:minmax(0,1fr) 290px}.dgrid .cat{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.dgrid .cat .grp{flex:1 1 180px}}
@media (max-width:820px){
  .mgrid,.egrid{grid-template-columns:minmax(0,1fr)}
  .dgrid{grid-template-columns:minmax(0,1fr)}
  .planwrap{height:62vh;min-height:360px}
  .v3wrap{height:64vh;min-height:360px}
  .dgrid .cat{order:3}
  .mgrid>.stack:last-child{order:-1;position:static!important}
  .egrid>.stack:last-child{position:static!important}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .top,.noprint,.tabs{display:none!important}
  body,html{background:#fff}
  .view{display:none!important}
  #printArea{display:block!important}
}
#printArea{display:none}
</style>

<div id="app">
  <header class="top">
    <div class="bar wrap">
      <div class="brand" title="Plumb &amp; Square">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1.5" y="1.5" width="23" height="23" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 20V6h14" fill="none" stroke="var(--accent)" stroke-width="2.6"/><path d="M15 9v8" stroke="currentColor" stroke-width="1.4"/><path d="M13 17h4l-2 3z" fill="currentColor"/></svg>
        <span>Plumb &amp; Square</span>
      </div>
      <input id="pname" class="pname" aria-label="Project name" data-bind="name" data-kind="text">
      <span class="save" id="saveState">Saved on this device</span>
      <div class="sp"></div>
      <button class="btn ghost sm" id="bUndo" data-act="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button class="btn ghost sm" id="bRedo" data-act="redo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
      <div class="seg" role="group" aria-label="Units">
        <button data-act="units" data-v="in" id="uIn">in</button><button data-act="units" data-v="mm" id="uMm">mm</button>
      </div>
      <div style="position:relative">
        <button class="btn" data-act="menu" id="bMenu" aria-haspopup="true">Projects ▾</button>
        <div class="menu" id="menu" hidden></div>
      </div>
    </div>
    <nav class="tabs wrap" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="measure">1 · Measure</button>
      <button class="tab" role="tab" data-tab="design">2 · Design</button>
      <button class="tab" role="tab" data-tab="elevations">Elevations</button>
      <button class="tab" role="tab" data-tab="view3d">3D</button>
      <button class="tab" role="tab" data-tab="estimate">3 · Estimate</button>
      <button class="tab" role="tab" data-tab="checks">Checks <span id="chkBadge"></span></button>
    </nav>
  </header>

  <main class="wrap">
    <section class="view" id="v-measure"></section>
    <section class="view" id="v-design"></section>
    <section class="view" id="v-elevations"></section>
    <section class="view" id="v-view3d">
      <div class="v3wrap" id="v3wrap">
        <canvas id="c3d" aria-label="3D view of the kitchen"></canvas>

    tri={pts:[A,B,Cc],legs:l,sum};
    const names=['Sink–range','Range–fridge','Fridge–sink'];
    l.forEach((v,k)=>{if(v<48)push('warn','Work triangle',names[k]+' leg is '+fmt(v,'ft'),'NKBA: each leg 4′–9′. A short leg crowds two work centers.',[]);else if(v>108)push('warn','Work triangle',names[k]+' leg is '+fmt(v,'ft'),'NKBA: each leg 4′–9′. Long legs mean extra steps.',[])});
    if(sum>312)push('warn','Work triangle','Triangle totals '+fmt(sum,'ft'),'NKBA: the three legs should total 26′ or less.',[]);
  }
  // 11. utilities vs fixtures
  R('Plumbing, gas and power at fixtures');
  const near=(it,types,slack)=>S.utils.filter(u=>types.includes(u.type)&&u.wall===it.wall&&u.x>=it.x-slack&&u.x<=it.x+it.w+slack);
  const nearestDist=(it,types)=>{const us=S.utils.filter(u=>types.includes(u.type)&&u.wall===it.wall);if(!us.length)return null;const c=it.x+it.w/2;return Math.min(...us.map(u=>Math.abs(u.x-c)))};
  const reloc={plumbing:0,elec:0,gas:0};
  for(const it of items){
    if(it.t==='SB'){
      if(it.wall==null)continue;
      const w=near(it,['water'],2),d=near(it,['drain'],2);
      if(!w.length||!d.length){reloc.plumbing++;const nd=nearestDist(it,['drain','water']);push('warn','Plumbing, gas and power at fixtures','Plumbing must move for the sink','No '+(!w.length&&!d.length?'supply or drain':!w.length?'supply':'drain')+' inside the '+lab(it)+'.'+(nd!=null?' Nearest stub is '+fmt(nd)+' from the sink centerline.':' None pinned on this wall.'),[it.id])}
    }
    if(it.t==='ISL'&&false){}
    if(it.t==='RG'&&it.wall!=null){
      const need=it.fuel==='gas'?['gas']:['v240'];
      if(!near(it,need,6).length){if(it.fuel==='gas')reloc.gas++;else reloc.elec++;push('warn','Plumbing, gas and power at fixtures',(it.fuel==='gas'?'Gas':'240V')+' supply must move for the range','No '+(it.fuel==='gas'?'gas stub':'240V circuit')+' within the range opening on W'+(it.wall+1)+'.',[it.id])}
    }
    if(it.t==='REF'&&it.wall!=null&&!near(it,['outlet','gfci'],0).length){reloc.elec++;push('warn','Plumbing, gas and power at fixtures','No receptacle behind the refrigerator','Add a dedicated 120V receptacle in the fridge opening.',[it.id])}
    if(it.t==='DW'&&it.wall!=null&&!near(it,['outlet','gfci'],24).length){reloc.elec++;push('info','Plumbing, gas and power at fixtures','No dishwasher circuit pinned','Add a receptacle or junction box in the adjacent sink base.',[it.id])}
    if(it.t==='MWD'&&it.wall!=null&&!near(it,['outlet','gfci'],0).length){reloc.elec++;push('info','Plumbing, gas and power at fixtures','No receptacle for the microwave drawer','Add a dedicated 20A receptacle in the opening.',[it.id])}
  }
  // hidden or blocked utilities
  R('Outlets, switches and registers not buried');
  for(const u of S.utils){
    if(UTIL[u.type]?.box)continue;
    for(const it of wallItems(u.wall)){
      if(u.x<it.x||u.x>it.x+it.w||u.z<it.z||u.z>it.z+it.h)continue;
      if(u.type==='vent'&&isBaseLevel(it))push('warn','Outlets, switches and registers not buried','Register behind '+lab(it),'HVAC register at '+fmt(u.x)+' would be buried. Relocate to a toe-kick diffuser.',[it.id],{reloc:'hvac'});
      else if((u.type==='outlet'||u.type==='gfci')&&!['REF','DW','MWD','RG','SB'].includes(it.t)&&!(it.t==='OV')){reloc.elec++;push(it.cls==='tall'||CAT[it.t].cls==='tall'?'warn':'info','Outlets, switches and registers not buried','Receptacle buried behind '+lab(it),'Receptacle at '+fmt(u.x)+' from left, '+fmt(u.z)+' AFF. Relocate it or cut it in.',[it.id])}
      else if(u.type==='sw'||u.type==='light')push('warn','Outlets, switches and registers not buried',UTIL[u.type].n+' behind '+lab(it),'At '+fmt(u.x)+' from left, '+fmt(u.z)+' AFF. Relocate before cabinets go in.',[it.id]);
    }
  }
  // 12. countertop receptacles
  R('Countertop receptacle spacing (NEC 210.52)');
  for(let j=0;j<n;j++){
    const row=baseRow(j).filter(it=>hasCT(it)||it.t==='SB');
    const segs=[];let cur=null;
    for(const it of row){if(it.t==='SB'||!hasCT(it)){cur=null;continue}if(cur&&Math.abs(it.x-cur.b)<0.3)cur.b=it.x+it.w;else{cur={a:it.x,b:it.x+it.w};segs.push(cur)}}
    const outs=S.utils.filter(u=>(u.type==='gfci'||u.type==='outlet')&&u.wall===j&&u.z>=st.counterH&&u.z<=st.counterH+20);
    for(const s of segs){if(s.b-s.a<12)continue;let miss=null;for(let x=s.a;x<=s.b+0.01;x+=2){if(!outs.some(o=>Math.abs(o.x-x)<=24)){miss=x;break}}
      if(miss!=null){reloc.elec++;push('warn','Countertop receptacle spacing (NEC 210.52)','Countertop on W'+(j+1)+' needs a receptacle near '+fmt(miss),'Every point along a counter must be within 24" of a receptacle. Run '+fmt(s.a)+'–'+fmt(s.b)+'.',[])}}
    if(outs.some(o=>o.type==='outlet'))push('info','Countertop receptacle spacing (NEC 210.52)','Counter receptacles on W'+(j+1)+' need GFCI protection','All kitchen countertop receptacles must be GFCI protected.',[]);
  }
  // 13. upper cabinet height
  R('Upper cabinet height above counter');
  for(const it of items){if(it.t!=='W'||it.wall==null)continue;const c=it.z-st.counterH;
    const overCT=baseRow(it.wall).some(b=>hasCT(b)&&b.x<it.x+it.w&&b.x+b.w>it.x);
    if(overCT&&c<15)push('warn','Upper cabinet height above counter',lab(it)+' is '+fmt(c)+' above the counter','NKBA: 15" minimum between counter and wall cabinets (18" typical).',[it.id]);}

  // keep only square-on dimension lines, nearest per island side, for the plan overlay
  const shown=[];const bestSide={};
  for(const l of lines){
    if(l.force){shown.push(l);continue}
    const I=l.a&&l.a.wall==null?l.a:l.b&&l.b.wall==null?l.b:l.a;const f=frame(I);
    const dx=l.q.x-l.p.x,dy=l.q.y-l.p.y,L=Math.hypot(dx,dy)||1;const du=(dx*f.U.x+dy*f.U.y)/L,dv=(dx*f.V.x+dy*f.V.y)/L;
    if(Math.abs(du)<0.985&&Math.abs(dv)<0.985)continue;
    const key=I.id+(Math.abs(du)>0.985?(du>0?'u+':'u-'):(dv>0?'v+':'v-'));
    if(!bestSide[key]||bestSide[key].d>l.d)bestSide[key]=l;
  }
  shown.push(...Object.values(bestSide));
  const counts={err:0,warn:0,info:0};out.forEach(o=>counts[o.sev]++);
  const failed=new Set(out.filter(o=>o.sev!=='info').map(o=>o.rule));
  const passed=[...ran].filter(r=>!failed.has(r));
  out.sort((a,b)=>rank(b.sev)-rank(a.sev));
  return C_={list:out,byItem,counts,passed,lines:shown,tri,reloc};
}

/* ---------- bill of materials ---------- */
function unitPrice(it){
  const st=S.settings,p=st.price,sku=CAT[it.t].sku(it);
  if(st.over[sku]!=null&&st.over[sku]!=='')return +st.over[sku];
  const pk=CAT[it.t].pk; if(!pk)return 0;
  const pr=p[pk]; if(!pr)return 0;
  if(pk==='filler')return pr[0]*(it.lay==='tall'?2:1);
  if(pk==='panel')return pr[0]*(it.lay==='tall'?2.4:1);
  return r2(pr[0]+pr[1]*it.w);
}
function frontCounts(){
  let doors=0,drawers=0,hinges=0,talls=0;
  for(const it of S.items){for(const f of fronts(it)){if(f.k==='door'){doors++;hinges+=f.h>40?3:2}else if(f.k==='drawer')drawers++}}
  return {doors,drawers,hinges};
}
function bom(){
  const st=S.settings,p=st.price,G=geom(),L=[];
  const add=(grp,sku,desc,qty,unit,price,key,kind='mat')=>{if(qty<=0&&kind!=='lump')return;L.push({grp,sku,desc,qty:r2(qty),unit,price:r2(price),key,kind})};
  // cabinets grouped by sku
  const cab={};
  for(const it of S.items){
    const c=CAT[it.t]; if(c.app)continue;
    if(it.t==='ISL'){
      const s=splitIsland(it);
      s.units.forEach(u=>{const sku=(it.style==='doors'?'B':'DB')+u;const k='ISL:'+sku;cab[k]=cab[k]||{grp:'Cabinets',sku,desc:'Island '+(it.style==='doors'?'base':'drawer base')+' '+u+'"',qty:0,unit:'ea',price:st.over[sku]!=null?+st.over[sku]:r2(p[it.style==='doors'?'base':'drawer'][0]+p[it.style==='doors'?'base':'drawer'][1]*u),key:'over.'+sku};cab[k].qty++});
      const ep='IEP'+it.d;cab[ep]=cab[ep]||{grp:'Cabinets',sku:ep,desc:'Island end panel '+it.d+'" deep',qty:0,unit:'ea',price:st.over[ep]!=null?+st.over[ep]:p.panel[0]*1.4,key:'over.'+ep};cab[ep].qty+=2;
      const bp='IBP'+it.w;cab[bp]=cab[bp]||{grp:'Cabinets',sku:bp,desc:'Island back panel '+it.w+'" (seating side)',qty:0,unit:'ea',price:st.over[bp]!=null?+st.over[bp]:r2(p.panel[0]+3*it.w),key:'over.'+bp};cab[bp].qty++;
      if(s.fill>0.0625){const fs='BF'+s.fill;cab['ISLF'+fs]=cab['ISLF'+fs]||{grp:'Cabinets',sku:fs,desc:'Island filler',qty:0,unit:'ea',price:p.filler[0],key:'price.filler'};cab['ISLF'+fs].qty++}
      continue;
    }
    const sku=c.sku(it);
    const key=sku+'|'+it.w+'|'+it.h+'|'+it.d;
    cab[key]=cab[key]||{grp:c.cls==='filler'?'Fillers & panels':'Cabinets',sku,desc:c.name+(c.cls==='filler'?' ('+(it.lay||'base')+')':'')+' — '+fmt(it.w)+' W × '+fmt(it.h)+' H × '+fmt(it.d)+' D',qty:0,unit:'ea',price:unitPrice(it),key:'over.'+sku};
    cab[key].qty++;
  }
  Object.values(cab).sort((a,b)=>a.grp.localeCompare(b.grp)||a.sku.localeCompare(b.sku,undefined,{numeric:true})).forEach(c=>L.push({...c,kind:'mat'}));
  // appliances
  for(const it of S.items){const c=CAT[it.t];if(!c.app)continue;const m=MODELS[it.t]?.[it.model];
    add('Appliances',c.sku(it),(m?m[0]:c.name)+(it.t==='RG'?' · '+(it.fuel==='gas'?'gas':'electric'):''),1,'ea',p.app[it.t]||0,'price.app.'+it.t);}
  // countertops
  let sq=0,edge=0,sinks=0,cooks=0;
  for(const it of S.items){
    if(it.wall==null){sq+=it.w*it.d/144;edge+=2*(it.w+it.d)/12;continue}
    if(hasCT(it)){sq+=it.w*st.ctDepth/144;edge+=it.w/12}
    if(it.t==='SB')sinks++;
  }
  for(const it of S.items)if(it.wall==null&&false)cooks++;
  const ctm=COUNTER[st.counter][0];
  add('Countertops','CT-'+st.counter.toUpperCase(),ctm+', '+fmt(st.ctThick)+' with eased edge — '+r2(sq*1.1).toFixed(1)+' sq ft incl. 10% waste',sq*1.1,'sq ft',p.ct[st.counter],'price.ct.'+st.counter);
  add('Countertops','CUT-SINK','Undermount sink cutout & polish',sinks,'ea',p.sinkCut,'price.sinkCut');
  // backsplash: wall run length behind counters
  let bsl=0;for(const it of S.items)if(it.wall!=null&&(hasCT(it)||it.t==='RG'))bsl+=it.w;
  add('Countertops','BSP',st.backsplashH+'" backsplash tile, installed',bsl*st.backsplashH/144,'sq ft',p.splash,'price.splash');
  // hardware
  const fc=frontCounts();
  add('Hardware','PULL',HW[st.hw][0]+' bar pull, 5" c-c',fc.doors+fc.drawers,'ea',p.pull,'price.pull');
  add('Hardware','HNG','Soft-close concealed hinge',fc.hinges,'ea',p.hinge,'price.hinge');
  add('Hardware','SLD','Full-extension soft-close slide (pair)',fc.drawers,'pr',p.slide,'price.slide');
  // trim
  let toe=0,crown=0,rail=0;
  for(const it of S.items){const c=CAT[it.t];if(c.app)continue;
    if(it.wall==null){toe+=2*(it.w-2);continue}
    if(isBaseLevel(it)&&c.cls!=='filler')toe+=it.w;
    if(it.t==='W'||c.cls==='tall'){crown+=it.w}
    if(it.t==='W')rail+=it.w;}
  add('Trim','TK8','Toe kick, finished, 8\' lengths',toe/12,'lin ft',p.toe,'price.toe');
  add('Trim','CRN','Crown molding'+(crown?' (incl. 10% & returns)':''),crown/12*1.1,'lin ft',p.crown,'price.crown');
  add('Trim','LR','Light rail molding',rail/12*1.1,'lin ft',p.rail,'price.rail');
  // labor
  const ncab=S.items.filter(i=>!CAT[i.t].app&&CAT[i.t].cls!=='filler').length+S.items.filter(i=>i.t==='ISL').reduce((s,i)=>s+splitIsland(i).units.length-1,0);
  const napp=S.items.filter(i=>CAT[i.t].app).length;
  const C=checks();
  add('Labor','INST-CAB','Cabinet installation (level, scribe, fasten)',ncab,'ea',p.installCab,'price.installCab','lab');
  add('Labor','INST-CT','Countertop template & install',sq,'sq ft',p.installCt,'price.installCt','lab');
  add('Labor','INST-APP','Appliance set & hook-up',napp,'ea',p.installApp,'price.installApp','lab');
  add('Labor','PLMB','Plumbing relocation (from site survey)',C.reloc.plumbing,'ea',p.plumbing,'price.plumbing','lab');
  add('Labor','ELEC','Electrical add / relocate (from site survey)',C.reloc.elec,'ea',p.elec,'price.elec','lab');
  add('Labor','GAS','Gas line relocation (from site survey)',C.reloc.gas,'ea',p.gas,'price.gas','lab');
  add('Labor','DEMO','Demolition & disposal',p.demo>0?1:0,'lot',p.demo,'price.demo','lab');
  add('Labor','PRMT','Permit & inspections',p.permit>0?1:0,'lot',p.permit,'price.permit','lab');
  const mat=L.filter(l=>l.kind==='mat').reduce((s,l)=>s+l.qty*l.price,0);
  const lab=L.filter(l=>l.kind==='lab').reduce((s,l)=>s+l.qty*l.price,0);
  const sub=mat+lab, mk=sub*st.markup/100, tax=mat*(1+st.markup/100)*st.tax/100, total=sub+mk+tax;
  return {lines:L,mat,lab,sub,mk,tax,total,sq,edge,fc,toe,crown,rail};
}

/* ---------- cut list ---------- */
function cutlist(){
  const st=S.settings,parts=[],frontsL=[],boxes=[];
  const P=(cab,part,qty,w,l,mat,eb)=>parts.push({cab,part,qty,w:r2(w),l:r2(l),mat,eb});
  const box=(label,t,w,h,d)=>{
    const tall=CAT[t]?.cls==='tall', wall=t==='W', base=!wall&&!tall;
    const hb=wall?h:h-st.toe, db=d-0.75, iw=w-1.5;
    P(label,'Side',2,db,hb,'¾" ply','F');
    P(label,'Bottom',1,iw,db,'¾" ply','F');
    if(base)P(label,'Stretcher',2,iw,4,'¾" ply','F');else P(label,'Top',1,iw,db,'¾" ply','F');
    P(label,'Back',1,w-1,hb-1,'¼" ply','');
    const sh=wall?(h>=30?2:1):tall?4:(t==='B'||t==='SB'||t==='BBC'?1:0);
    if(sh&&t!=='SB')P(label,'Adj. shelf',sh,iw-0.0625,db-1,'¾" ply','F');
    if(base||tall)P(label,'Toe kick (finished)',1,w,st.toe,'¾" ply','');
  };
  const drawerBox=(label,fr,w)=>{if(fr.k!=='drawer')return;const hh=Math.max(3,Math.round((fr.h-1.5)*2)/2);P(label,'Drawer box '+fmt(w-1.5-1)+' × '+fmt(hh)+' × 21"',1,w-2.5,21,'½" Baltic birch','')};
  for(const it of S.items){
    const c=CAT[it.t]; if(c.app)continue;
    if(c.cls==='filler'){P(c.sku(it),it.t==='PNL'?'Finished end panel':'Filler',1,it.t==='PNL'?it.d:it.w,it.h,it.t==='PNL'?'¾" finished panel':'¾" finished stock','');continue}
    if(it.t==='ISL'){const s=splitIsland(it);s.units.forEach((u,k)=>{const lab='ISL '+(it.style==='doors'?'B':'DB')+u+'-'+(k+1);box(lab,it.style==='doors'?'B':'DB',u,st.counterH-st.ctThick,24);frontsFor(it.style==='doors'?'B':'DB',u,st.counterH-st.ctThick).forEach(f=>{frontsL.push({cab:lab,...f});drawerBox(lab,f,u)})});
      P('ISL','Finished end panel',2,it.d-1,st.counterH-st.ctThick,'¾" finished panel','');P('ISL','Back panel',1,it.w-2,st.counterH-st.ctThick,'¾" finished panel','');continue}
    const label=c.sku(it);box(label,it.t,it.w,it.h,it.d);
    for(const f of fronts(it)){if(f.k==='blind'||f.k==='oven')continue;frontsL.push({cab:label,...f});drawerBox(label,f,it.w)}
  }
  let a34=0,a14=0,eb=0;
  for(const p of parts){const a=p.w*p.l*p.qty;if(p.mat==='¾" ply')a34+=a;else if(p.mat==='¼" ply')a14+=a;if(p.eb)eb+=p.w*p.qty}
  return {parts,fronts:frontsL,sheets34:Math.ceil(a34/(48*96*0.82)),sheets14:Math.ceil(a14/(48*96*0.85)),eb:Math.ceil(eb/12)};
}

/* ---------- persistence ---------- */
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const CLOUD={db:null,uid:null,ready:false,dl:null};
let saveT=null,saving=false,pendingSave=false;
function localIndex(){return LS.get('ps.index')||{}}
function scheduleSave(){
  clearTimeout(saveT);
  setSave('Saving…');
  saveT=setTimeout(doSave,900);
}
async function doSave(){
  const p=clone(S);
  const idx=localIndex();idx[p.id]={name:p.name,updatedAt:p.updatedAt};LS.set('ps.index',idx);LS.set('ps.p.'+p.id,p);LS.set('ps.current',p.id);
  if(CLOUD.ready){
    if(saving){pendingSave=true;return}
    saving=true;
    try{await CLOUD.db.collection('data/users/'+CLOUD.uid).doc(p.id).set({json:JSON.stringify(p),name:p.name,updatedAt:p.updatedAt});setSave('Saved to your account')}
    catch(e){setSave('Saved on this device');if(e&&e.code==='invalid_argument')CLOUD.ready=false}
    saving=false; if(pendingSave){pendingSave=false;doSave()}
  } else setSave('Saved on this device');
}
function setSave(t){const el=$('#saveState');if(el)el.textContent=t}
async function listProjects(){
  const idx=localIndex();const out={};
  for(const [id,v] of Object.entries(idx))out[id]={id,name:v.name,updatedAt:v.updatedAt,src:'device'};
  if(CLOUD.ready){try{const snap=await CLOUD.db.collection('data/users/'+CLOUD.uid).get();snap.docs.forEach(d=>{const v=d.data();if(!out[d.id]||out[d.id].updatedAt<=v.updatedAt)out[d.id]={id:d.id,name:v.name,updatedAt:v.updatedAt,src:'account'}})}catch(e){}}
  return Object.values(out).sort((a,b)=>b.updatedAt-a.updatedAt);
}
async function loadProject(id){
  let p=LS.get('ps.p.'+id);
  if(CLOUD.ready){try{const d=await CLOUD.db.collection('data/users/'+CLOUD.uid).doc(id).get();if(d.exists){const v=d.data();const cp=JSON.parse(v.json);if(!p||cp.updatedAt>p.updatedAt)p=cp}}catch(e){}}
  return p?normalize(p):null;
}
function setProject(p,keepHist){
  S=normalize(p);SEL=null;UI.view=null;UI.wall=0;UI.elevWall=0;invalidate();
  if(!keepHist){HIST.stack=[JSON.stringify(S)];HIST.i=0}
  render();
}
async function initCloud(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user,dl]=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads')]);
    CLOUD.dl=dl;
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    CLOUD.db=db;CLOUD.uid=id;CLOUD.ready=true;
    // pull a newer copy of the open project, if the account has one
    const d=await db.collection('data/users/'+id).doc(S.id).get().catch(()=>null);
    if(d&&d.exists){const v=d.data();if(v.updatedAt>S.updatedAt){setProject(JSON.parse(v.json));toast('Loaded the latest copy from your account')}}
    else if(!S.sample) doSave();
    setSave(S.sample&&!(d&&d.exists)?'Sample project':'Saved to your account');
  }catch(e){CLOUD.ready=false}
}

/* ---------- file output ---------- */
async function saveFile(name,data,mime){
  if(CLOUD.dl){try{await CLOUD.dl.save({filename:name,data});toast('Saved '+name);return}catch(e){if(e&&e.code==='declined')return;}}
  if(!IN_FRAME){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Downloaded '+name);return}
  try{await navigator.clipboard.writeText(data);toast('File saving is not available here — copied '+name+' contents to the clipboard')}catch(e){toast('File saving is not available in this view','err')}
}
const csv=rows=>rows.map(r=>r.map(v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');

/* ---------- toast ---------- */
let toastT;
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast'+(kind==='err'?' err':'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,kind==='err'?5200:3000)}

/* ---------- history ---------- */
function commit(){
  S.updatedAt=Date.now();if(S.sample)S.sample=false;
  const snap=JSON.stringify(S);
  if(HIST.stack[HIST.i]!==snap){HIST.stack=HIST.stack.slice(0,HIST.i+1);HIST.stack.push(snap);if(HIST.stack.length>100)HIST.stack.shift();HIST.i=HIST.stack.length-1}
  invalidate();scheduleSave();render();
}
function undo(){if(HIST.i>0){HIST.i--;S=JSON.parse(HIST.stack[HIST.i]);invalidate();scheduleSave();render();toast('Undone')}}
function redo(){if(HIST.i<HIST.stack.length-1){HIST.i++;S=JSON.parse(HIST.stack[HIST.i]);invalidate();scheduleSave();render()}}

/* ---------- binding ---------- */
function resolve(path){
  const parts=path.split('.');let obj=S;
  if(parts[0]==='it'){obj=S.items.find(i=>i.id===parts[1]);parts.splice(0,2)}
  else if(parts[0]==='ut'){obj=S.utils.find(i=>i.id===parts[1]);parts.splice(0,2)}
  if(!obj)return null;
  for(let k=0;k<parts.length-1;k++){if(obj[parts[k]]==null)obj[parts[k]]={};obj=obj[parts[k]]}
  return {obj,key:parts[parts.length-1]};
}
const AFTER={
  model(it){const m=MODELS[it.t]?.[it.model];if(m){it.w=m[1];it.d=m[2];it.h=m[3]}},
  lay(it){const st=S.settings;if(it.lay==='wall'){it.z=st.wallBottom;it.h=30;it.d=12}else if(it.lay==='tall'){it.z=0;it.h=84;it.d=24}else{it.z=0;it.h=34.5;it.d=24}},
  wallh(it){/* keep tops aligned at 84 when changing wall cabinet height */const top=S.settings.wallBottom+30;if(it.t==='W'&&it._prevTop==null){it.z=Math.max(S.settings.counterH+12,top-it.h)}},
  walls(){while(S.corners.length<S.walls.length)S.corners.push({ang:90})},
  diag(el){}
};
let NEXT_FOCUS=false;
function onChange(e){
  const el=e.target;const b=el.dataset.bind;if(!b)return;
  const k=el.dataset.kind;let v;
  if(k==='len'){
    if(el.value.trim()===''&&el.dataset.null!=null)v=null;
    else{v=parseLen(el.value);if(v==null||isNaN(v)){toast('Couldn\'t read "'+el.value+'". Try 123 5/8, 10\' 3-1/2", or 3125mm.','err');render();return}
      if(el.dataset.min!=null&&v<+el.dataset.min){toast('That value is too small.','err');render();return}}
  } else if(k==='num'){if(el.value.trim()===''&&el.dataset.null!=null)v=null;else{v=parseFloat(el.value);if(isNaN(v)){render();return}}}
  else if(k==='int'){v=parseInt(el.value,10);if(isNaN(v))v=null}
  else if(k==='bool')v=el.checked;
  else v=el.value;
  const r=resolve(b);if(!r)return;
  if(v===null&&el.dataset.null==='delete')delete r.obj[r.key];else r.obj[r.key]=v;
  if(el.dataset.after)AFTER[el.dataset.after]?.(r.obj,el);
  const seq=NEXT_FOCUS?el.dataset.seq:null;NEXT_FOCUS=false;
  commit();
  if(seq!=null){const all=$$('[data-seq]').sort((a,b)=>a.dataset.seq-b.dataset.seq);const nx=all.find(x=>+x.dataset.seq>+seq);if(nx){nx.focus();nx.select?.()}}
}

/* ---------- laser (Web Bluetooth + HID keyboard mode) ---------- */
const LASER={dev:null,name:'',lastInput:null};
const LEICA_S='3ab10100-f831-4395-b29d-570977d5bf94',LEICA_D='3ab10101-f831-4395-b29d-570977d5bf94';
const BOSCH_S='02a6c0d0-0451-4000-b000-fb3210111989',BOSCH_C='02a6c0d1-0451-4000-b000-fb3210111989';
async function laserConnect(){
  if(!navigator.bluetooth){toast(IN_FRAME?'Bluetooth is blocked inside this viewer. Use keyboard (HID) mode, or open the standalone file in Chrome/Edge (Android, Windows, Mac) or the Bluefy browser on iPhone.':'This browser has no Web Bluetooth. Use Chrome or Edge, Bluefy on iPhone, or the laser\'s keyboard (HID) mode.','err');return}
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:[LEICA_S]},{services:[BOSCH_S]},{namePrefix:'DISTO'},{namePrefix:'GLM'},{namePrefix:'PLR'}],optionalServices:[LEICA_S,BOSCH_S]});
    const server=await dev.gatt.connect();
    let ok=false;
    try{const svc=await server.getPrimaryService(LEICA_S);const ch=await svc.getCharacteristic(LEICA_D);await ch.startNotifications();ch.addEventListener('characteristicvaluechanged',e=>laserReading(e.target.value.getFloat32(0,true)/0.0254));ok=true}catch(e){}
    if(!ok){const svc=await server.getPrimaryService(BOSCH_S);const ch=await svc.getCharacteristic(BOSCH_C);await ch.startNotifications();
      ch.addEventListener('characteristicvaluechanged',e=>{const dv=e.target.value;if(dv.byteLength>=11&&dv.getUint8(0)===0xC0&&dv.getUint8(1)===0x55&&dv.getUint8(2)===0x10)laserReading(dv.getFloat32(7,true)/0.0254)});
      await ch.writeValue(new Uint8Array([0xC0,0x55,0x02,0x01,0x00,0x1A]));ok=true}
    LASER.dev=dev;LASER.name=dev.name||'Laser';dev.addEventListener('gattserverdisconnected',()=>{LASER.dev=null;render();toast('Laser disconnected')});
    toast('Connected to '+LASER.name+'. Tap a field, then press the laser\'s measure button.');render();
  }catch(e){if(e&&e.name==='NotFoundError')return;toast('Could not connect: '+(e&&e.message||e),'err')}
}
function laserReading(inches){
  if(!(inches>0))return;
  let el=document.activeElement;
  if(!el||!el.matches||!el.matches('input[data-kind="len"]'))el=LASER.lastInput&&document.body.contains(LASER.lastInput)?LASER.lastInput:null;
  if(!el){toast('Laser: '+fmt(inches,'ft')+' — tap a measurement field first');return}
  el.value=fmt(inches);NEXT_FOCUS=true;
  toast('Laser: '+fmt(inches,'ft')+(el.getAttribute('aria-label')?' → '+el.getAttribute('aria-label'):''));
  el.dispatchEvent(new Event('change',{bubbles:true}));
}

/* ---------- PLAN (SVG) ---------- */
function planInner(mini){
  const G=geom(),C=checks(),st=S.settings;const Y=y=>-y;
  let s='';
  const pts=G.P.map(p=>p.x+','+Y(p.y)).join(' ');
  s+=`<polygon class="pl-floor" points="${pts}"/>`;
  // walls
  for(const w of G.walls){const T=4.5;const o={x:-w.n.x*T,y:-w.n.y*T};
    s+=`<polygon class="pl-wall" points="${w.a.x},${Y(w.a.y)} ${w.b.x},${Y(w.b.y)} ${w.b.x+o.x},${Y(w.b.y+o.y)} ${w.a.x+o.x},${Y(w.a.y+o.y)}"/>`;
    // openings
    for(const u of S.utils){if(u.wall!==w.i||(u.type!=='window'&&u.type!=='door'))continue;
      const a={x:w.a.x+w.d.x*u.x,y:w.a.y+w.d.y*u.x},b={x:w.a.x+w.d.x*(u.x+u.w),y:w.a.y+w.d.y*(u.x+u.w)};
      s+=`<polygon fill="var(--floor)" points="${a.x+w.n.x*0.3},${Y(a.y+w.n.y*0.3)} ${b.x+w.n.x*0.3},${Y(b.y+w.n.y*0.3)} ${b.x+o.x*1.1},${Y(b.y+o.y*1.1)} ${a.x+o.x*1.1},${Y(a.y+o.y*1.1)}"/>`;
      if(u.type==='window')s+=`<line x1="${a.x+o.x/2}" y1="${Y(a.y+o.y/2)}" x2="${b.x+o.x/2}" y2="${Y(b.y+o.y/2)}" stroke="var(--blue)" stroke-width=".8"/><line x1="${a.x}" y1="${Y(a.y)}" x2="${b.x}" y2="${Y(b.y)}" stroke="var(--wallfill)" stroke-width=".4"/><line x1="${a.x+o.x}" y1="${Y(a.y+o.y)}" x2="${b.x+o.x}" y2="${Y(b.y+o.y)}" stroke="var(--wallfill)" stroke-width=".4"/>`;
      else{const r=u.w;const e={x:a.x+w.n.x*r,y:a.y+w.n.y*r};s+=`<path d="M${a.x},${Y(a.y)} L${e.x},${Y(e.y)} A${r},${r} 0 0 1 ${b.x},${Y(b.y)}" fill="none" stroke="var(--muted)" stroke-width=".4" stroke-dasharray="1.5 1"/>`}
    }
    if(!mini||true){const m={x:(w.a.x+w.b.x)/2-w.n.x*11,y:(w.a.y+w.b.y)/2-w.n.y*11};let ang=Math.atan2(-w.d.y,w.d.x)/D2R;if(ang>90)ang-=180;if(ang<=-90)ang+=180;
      s+=`<text class="pl-wl" x="${m.x}" y="${Y(m.y)}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${ang} ${m.x} ${Y(m.y)})" ${mini?'style="font-size:7px"':''}>W${w.i+1} · ${esc(fmt(w.len,'ft'))}</text>`}
  }
  G.corners.forEach((a,i)=>{if(Math.abs(a-90)<0.15)return;const p=G.P[(i+1)%G.P.length];const w=G.walls[(i+1)%G.walls.length],w0=G.walls[i];const q={x:p.x+(w.n.x+w0.n.x)*9,y:p.y+(w.n.y+w0.n.y)*9};s+=`<text class="pl-ang" x="${q.x}" y="${Y(q.y)}" text-anchor="middle" ${mini?'style="font-size:6px"':''}>${a.toFixed(1)}°</text>`});
  if(mini){
    for(const u of S.utils){const T=UTIL[u.type];if(!T||T.box)continue;const w=G.walls[u.wall];if(!w)continue;const p={x:w.a.x+w.d.x*u.x+w.n.x*3,y:w.a.y+w.d.y*u.x+w.n.y*3};s+=`<circle cx="${p.x}" cy="${Y(p.y)}" r="2.6" fill="${T.c}"/>`}
    for(const it of S.items){const P=itemPoly(it);if(!P)continue;s+=`<polygon points="${P.map(p=>p.x+','+Y(p.y)).join(' ')}" fill="var(--blue-soft)" stroke="var(--line2)" stroke-width=".5"/>`}
    return s;
  }
  // countertop outlines
  for(const it of S.items){if(!(hasCT(it)||it.t==='RG')||it.wall==null)continue;const P=ctPoly(it);s+=`<polygon class="pl-ct" points="${P.map(p=>p.x+','+Y(p.y)).join(' ')}"/>`}
  // items, base level first then uppers
  const order=[...S.items].sort((a,b)=>(isUpper(a)?1:0)-(isUpper(b)?1:0));
  for(const it of order){
    if(isUpper(it)&&!UI.showUpper)continue;
    const P=itemPoly(it);if(!P)continue;const c=CAT[it.t];
    const cls=it.t==='ISL'?'pl-isl':c.cls==='filler'?'pl-fill':c.app?'pl-app':c.cls==='tall'?'pl-tall':isUpper(it)?'pl-wallc':'pl-base';
    const sev=C.byItem[it.id];const sel=SEL===it.id;
    s+=`<polygon data-id="${it.id}" class="pl-it ${cls} ${sel?'pl-sel':sev==='err'?'pl-e':sev==='warn'?'pl-w':''}" points="${P.map(p=>p.x+','+Y(p.y)).join(' ')}"/>`;
    const f=frame(it);
    if(it.t==='ISL'){
      const cd=it.d-1-24; const cl=rectPoly(f,it.w,it.d-1,cd);s+=`<polygon points="${cl.map(p=>p.x+','+Y(p.y)).join(' ')}" fill="none" stroke="var(--cab-stroke)" stroke-width=".35" stroke-dasharray="2 1" pointer-events="none"/>`;
      if(it.seat>=9){const nseat=Math.floor(it.w/24);for(let k=0;k<nseat;k++){const u=(k+0.5)*it.w/nseat;const p={x:f.o.x+f.U.x*u-f.V.x*8,y:f.o.y+f.U.y*u-f.V.y*8};s+=`<circle class="pl-seat" cx="${p.x}" cy="${Y(p.y)}" r="7"/>`}}
    }

function addItem(t){

function fillGap(j,a,b,z){
  const st=S.settings;const len=b-a;const upper=z>st.counterH;const layer=upper?'wall':'base';
  const wlen=geom().walls[j].len;const atRightWall=Math.abs(b-wlen)<0.1;
  const mkF=(x,w)=>mkItem('F',{wall:j,x:r2(x),w:r2(w),lay:layer,z:upper?st.wallBottom:0,h:upper?30:34.5,d:upper?12:24});
  if(len<=6){S.items.push(mkF(a,len));return 1}
  const t=upper?'W':'B';const ws=CAT[t].ws.slice().reverse();
  let rem=len;const widths=[];
  while(rem>6){
    const fit=ws.find(w=>rem-w>=1&&rem-w<=4);if(fit){widths.push(fit);rem-=fit;break}
    const w=ws.find(w=>w<=rem-1&&rem-w>=10)||ws.find(w=>w<=rem-1);if(!w)break;widths.push(w);rem-=w;
  }
  rem=r2(rem);
  if(!widths.length){S.items.push(mkF(a,len));return 1}
  let x=a;
  if(!atRightWall&&rem>0.0625){S.items.push(mkF(x,rem));x+=rem}
  for(const w of widths){S.items.push(mkItem(t,{wall:j,x:r2(x),w,z:upper?st.wallBottom:0,h:upper?30:34.5}));x+=w}
  if(atRightWall&&rem>0.0625)S.items.push(mkF(x,rem));
  return widths.length+(rem>0.0625?1:0);
}
function autofill(j){
  const st=S.settings;let k=0;
  for(const [z0,z1] of [[0,st.counterH-1],[st.counterH+6,S.ceiling]]){
    const gs=gaps(j,z0,z1);
    for(const g of gs){
      // skip gaps blocked by openings
      const blocked=S.utils.some(u=>u.wall===j&&(u.type==='window'||u.type==='door')&&u.x-(u.trim||0)<g.b&&u.x+u.w+(u.trim||0)>g.a&&(u.type==='door'||z0>0));
      if(blocked)continue;
      k+=fillGap(j,g.a,g.b,z0);
    }
  }

}
/* plan interaction: drag, pan, pinch, wheel */
function wirePlan(){
  const svg=$('#plan');const pts=new Map();let drag=null,pan=null,pinch=null;
  const world=(e)=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();if(!m)return {x:0,y:0};const q=p.matrixTransform(m.inverse());return {x:q.x,y:-q.y}};
  const vb=()=>{const v=svg.viewBox.baseVal;return {x:v.x,y:v.y,w:v.width,h:v.height}};
  svg.addEventListener('pointerdown',e=>{
    svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){drag=null;const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),v:vb(),c:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};return}
    const id=e.target.dataset&&e.target.dataset.id;
    const p=world(e);
    if(id){const it=S.items.find(i=>i.id===id);if(!it)return;if(SEL!==id){SEL=id;if(it.wall!=null)UI.wall=it.wall;renderInspector();drawPlan()}
      const f=frame(it);
      drag={it,start:p,moved:false,grabU:(p.x-f.o.x)*f.U.x+(p.y-f.o.y)*f.U.y,grabV:(p.x-f.o.x)*f.V.x+(p.y-f.o.y)*f.V.y,ox:it.cx,oy:it.cy};
    } else {pan={c:{x:e.clientX,y:e.clientY},v:vb(),moved:false}}
  });
  svg.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const k=pinch.d/d;const r=svg.getBoundingClientRect();
      const cx=pinch.v.x+(pinch.c.x-r.left)/r.width*pinch.v.w,cy=pinch.v.y+(pinch.c.y-r.top)/r.height*pinch.v.h;
      UI.view={x:cx-(cx-pinch.v.x)*k,y:cy-(cy-pinch.v.y)*k,w:pinch.v.w*k,h:pinch.v.h*k};svg.setAttribute('viewBox',`${UI.view.x} ${UI.view.y} ${UI.view.w} ${UI.view.h}`);return}
    if(drag){const p=world(e);if(!drag.moved&&Math.hypot(p.x-drag.start.x,p.y-drag.start.y)<1.2)return;drag.moved=true;dragMove(drag,p);svg.innerHTML=planInner(false)}
    else if(pan){const r=svg.getBoundingClientRect();const dx=(e.clientX-pan.c.x)/r.width*pan.v.w,dy=(e.clientY-pan.c.y)/r.height*pan.v.h;if(Math.abs(e.clientX-pan.c.x)+Math.abs(e.clientY-pan.c.y)>3)pan.moved=true;
      UI.view={x:pan.v.x-dx,y:pan.v.y-dy,w:pan.v.w,h:pan.v.h};svg.setAttribute('viewBox',`${UI.view.x} ${UI.view.y} ${UI.view.w} ${UI.view.h}`)}
  });
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;
    if(drag){const d=drag;drag=null;if(d.moved)commit()}
    else if(pan){if(!pan.moved&&SEL){SEL=null;renderInspector();drawPlan()}pan=null}};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  svg.addEventListener('wheel',e=>{e.preventDefault();const v=vb();const k=e.deltaY>0?1.1:1/1.1;const r=svg.getBoundingClientRect();const cx=v.x+(e.clientX-r.left)/r.width*v.w,cy=v.y+(e.clientY-r.top)/r.height*v.h;
    UI.view={x:cx-(cx-v.x)*k,y:cy-(cy-v.y)*k,w:v.w*k,h:v.h*k};svg.setAttribute('viewBox',`${UI.view.x} ${UI.view.y} ${UI.view.w} ${UI.view.h}`)},{passive:false});
}
function dragMove(d,p){
  const it=d.it;
  if(it.wall==null){const dx=p.x-d.start.x,dy=p.y-d.start.y;it.cx=Math.round((d.ox+dx)*2)/2;it.cy=Math.round((d.oy+dy)*2)/2;invalidate();return}
  const G=geom();let best=null;
  for(const w of G.walls){const t=toWall(w,p);if(t.u<-18||t.u>w.len+18||t.v<-30||t.v>Math.max(60,it.d+30))continue;const sc=Math.abs(t.v-it.d/2);if(!best||sc<best.sc)best={w,t,sc}}
  if(!best)return;
  it.wall=best.w.i;
  let x=best.t.u-d.grabU;
  const snap=UI.snap;x=Math.round(x/snap)*snap;
  const occ=occupied(it.wall,it.z,it.z+it.h,it);
  const edges=[0,best.w.len];occ.forEach(o=>{edges.push(o.u0,o.u1)});

function elevItem(it,y,fs){

}

    body=`<div class="stack"><div class="row"><button class="btn pri" data-act="csvcut">Export cut list (CSV)</button><button class="btn" data-act="csvfronts">Export door &amp; drawer order (CSV)</button><button class="btn" data-act="copyorder">Copy order summary</button></div>

      <p class="hint">Frameless (European) boxes in ¾" ply, ¼" backs captured in dadoes, full-overlay fronts with ⅛" reveals. Box depth is cabinet depth minus the ¾" front. Sizes are finished dimensions, width × length (grain runs with length).</p>
      <div class="grid2"><div class="card stack"><h3>Carcass parts</h3><div class="tw"><table class="t"><thead><tr><th>Cabinet</th><th>Part</th><th class="n">Qty</th><th class="n">W</th><th class="n">L</th><th>Material</th><th>Edge</th></tr></thead><tbody>${pr}</tbody></table></div></div>
      <div class="card stack"><h3>Door &amp; drawer fronts</h3><div class="tw"><table class="t"><thead><tr><th>Cabinet</th><th>Front</th><th class="n">W</th><th class="n">H</th></tr></thead><tbody>${fr}</tbody></table></div></div></div></div>`;
  }
  $('#v-estimate').innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Step 3 · Estimating &amp; ordering</div><h2>${esc(S.name)}</h2></div>${tabs}</div>${body}</div>`;
}
function totalsCard(B){const st=S.settings;return `<div class="card tot"><h3 style="margin-bottom:6px">Totals</h3>
  <div class="l"><span>Materials</span><span>${money(B.mat)}</span></div><div class="l"><span>Labor</span><span>${money(B.lab)}</span></div>
  <div class="l"><span>Markup <input class="in mono" id="t-mk" style="width:64px;display:inline-block;min-height:28px;padding:2px 6px" data-bind="settings.markup" data-kind="num" value="${st.markup}" aria-label="Markup percent">%</span><span>${money(B.mk)}</span></div>
  <div class="l"><span>Tax on materials <input class="in mono" id="t-tx" style="width:64px;display:inline-block;min-height:28px;padding:2px 6px" data-bind="settings.tax" data-kind="num" value="${st.tax}" aria-label="Tax percent">%</span><span>${money(B.tax)}</span></div>
  <div class="l g"><span>Total</span><span>${money(B.total)}</span></div>
  <div class="l"><span>Deposit <input class="in mono" id="t-dp" style="width:64px;display:inline-block;min-height:28px;padding:2px 6px" data-bind="settings.deposit" data-kind="num" value="${st.deposit}" aria-label="Deposit percent">%</span><span>${money(B.total*st.deposit/100)}</span></div></div>`}
function layoutName(){const ws=new Set(S.items.filter(i=>i.wall!=null&&isBaseLevel(i)).map(i=>i.wall));const isl=S.items.some(i=>i.wall==null);const n=ws.size;
  const nm=n<=1?'Single-wall':n===2?([...ws].some(a=>[...ws].some(b=>a!==b&&(Math.abs(a-b)===1||Math.abs(a-b)===S.walls.length-1)))?'L-shaped':'Galley'):'U-shaped';return nm+(isl?' with island':'')}
function proposalHTML(B){
  const st=S.settings,mk=1+st.markup/100,today=new Date();const no='P-'+today.toISOString().slice(2,10).replace(/-/g,'')+'-'+S.id.slice(0,3).toUpperCase();
  const groups={};B.lines.forEach(l=>{(groups[l.grp]=groups[l.grp]||[]).push(l)});
  const rows=Object.entries(groups).map(([g,ls])=>{const tot=ls.reduce((s,l)=>s+l.qty*l.price*mk,0);if(tot<=0&&g!=='Appliances')return '';
    return `<tr><td colspan="3" style="padding-top:14px"><b>${esc(g)}</b></td></tr>`+ls.filter(l=>l.qty>0).map(l=>`<tr><td>${esc(l.desc)}</td><td class="n">${l.qty} ${esc(l.unit)}</td><td class="n">${l.price>0?money(l.qty*l.price*mk):'By owner'}</td></tr>`).join('')+`<tr><td></td><td class="n" style="font-weight:600">${esc(g)} subtotal</td><td class="n" style="font-weight:600">${money(tot)}</td></tr>`}).join('');
  const sum=B.sub+B.mk;
  return `<div style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:3px solid #1d2930;padding-bottom:12px;margin-bottom:16px">
    <div><div style="font:600 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:#6b777d">Kitchen proposal</div><h1>${esc(S.name)}</h1><div>${esc(S.client||'Client')}${S.address?' · '+esc(S.address):''}</div></div>
    <div style="text-align:right"><b>${esc(st.company||'Your company')}</b><br>${esc(st.phone||'')}<br><span class="mono">${no}</span><br>${today.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</div></div>
    <p><b>Scope.</b> ${layoutName()} kitchen, ${S.items.filter(i=>!CAT[i.t].app&&CAT[i.t].cls!=='filler').length} cabinets in ${esc(FINISH[st.finish][0].toLowerCase())}, ${esc(COUNTER[st.counter][0].toLowerCase())} countertops (${B.sq.toFixed(1)} sq ft), ${esc(HW[st.hw][0].toLowerCase())} hardware, ${st.backsplashH}" tile backsplash. Room ${fmt(geom().bbox.w,'ft')} × ${fmt(geom().bbox.h,'ft')}, ${S.ceiling}" ceiling.</p>
    <table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Amount</th></tr></thead><tbody>${rows}</tbody></table>
    <table style="margin-top:16px;max-width:360px;margin-left:auto"><tr><td>Subtotal</td><td class="n">${money(sum)}</td></tr><tr><td>Sales tax</td><td class="n">${money(B.tax)}</td></tr><tr><td><b>Total</b></td><td class="n"><b>${money(B.total)}</b></td></tr><tr><td>Deposit due at signing (${st.deposit}%)</td><td class="n">${money(B.total*st.deposit/100)}</td></tr></table>
    <p style="font-size:12px;color:#55626a;margin-top:20px">${esc(st.terms)}</p>
    <div class="sig"><div>Client signature &amp; date</div><div>${esc(st.company||'Contractor')} &amp; date</div></div>`;
}
function proposalText(B){const st=S.settings,mk=1+st.markup/100;let t=`KITCHEN PROPOSAL — ${S.name}\n${S.client||''}${S.address?' · '+S.address:''}\n${st.company||''} ${st.phone||''}\n\n`;
  let g='';for(const l of B.lines){if(l.qty<=0)continue;if(l.grp!==g){g=l.grp;t+=`\n${g.toUpperCase()}\n`}t+=`  ${l.desc} — ${l.qty} ${l.unit}${l.price>0?' — '+money(l.qty*l.price*mk):' — by owner'}\n`}
  t+=`\nSubtotal ${money(B.sub+B.mk)}\nTax ${money(B.tax)}\nTOTAL ${money(B.total)}\nDeposit (${st.deposit}%) ${money(B.total*st.deposit/100)}\n\n${st.terms}\n`;return t}

/* ---------- CHECKS ---------- */
function renderChecks(){
  const C=checks();const by=s=>C.list.filter(x=>x.sev===s);
  const sec=(s,title)=>{const l=by(s);if(!l.length)return '';return `<div class="stack"><h3>${title} · ${l.length}</h3>${l.map(x=>`<button class="issue" data-act="goissue" data-ids="${x.ids.join(',')}"><span class="sev sev-${x.sev}"></span><span><b>${esc(x.title)}</b><span>${esc(x.detail)}</span><br><span class="eyebrow" style="font-size:10px">${esc(x.rule)}</span></span></button>`).join('')}</div>`};
  const tri=C.tri?`<dl class="kv"><dt>Sink → range</dt><dd>${fmt(C.tri.legs[0],'ft')}</dd><dt>Range → fridge</dt><dd>${fmt(C.tri.legs[1],'ft')}</dd><dt>Fridge → sink</dt><dd>${fmt(C.tri.legs[2],'ft')}</dd><dt>Total</dt><dd>${fmt(C.tri.sum,'ft')}</dd></dl>`:'<p class="hint">Add a sink base, range and refrigerator to measure the work triangle.</p>';
  $('#v-checks').innerHTML=`<div class="egrid"><div class="stack">
    <div><div class="eyebrow">Rule-based guardrails</div><h2>${C.counts.err?C.counts.err+' must-fix, ':''}${C.counts.warn} warning${C.counts.warn===1?'':'s'}, ${C.counts.info} note${C.counts.info===1?'':'s'}</h2></div>
    ${sec('err','Must fix')}${sec('warn','Warnings')}${sec('info','Notes for the installer')}
    ${!C.list.length?'<div class="card"><span class="pill p-ok">Everything passes</span></div>':''}
  </div><div class="stack" style="position:sticky;top:110px">
    <div class="card stack"><h3>Passing</h3>${C.passed.map(p=>`<div class="row"><span class="pill p-ok">✓</span><span>${esc(p)}</span></div>`).join('')||'<p class="hint">Nothing fully passing yet.</p>'}</div>
    <div class="card stack"><h3>Work triangle</h3>${tri}</div>
    <div class="card stack"><h3>What is checked</h3><p class="hint">NKBA kitchen planning guidelines (aisles, landing areas, work triangle, dishwasher placement, upper cabinet height), NEC 210.52 countertop receptacle spacing and GFCI, hood clearances, physical collisions in 3D, out-of-square scribe, window and door casing, soffits and ceiling height, and utilities that a fixture needs or a cabinet would bury. Guidelines vary by jurisdiction and manufacturer; confirm with local code and install manuals.</p></div>
  </div></div>`;
}

/* ---------- actions ---------- */
async function openMenu(){
  const m=$('#menu');if(!m.hidden){m.hidden=true;return}
  m.innerHTML='<div class="hint" style="padding:8px">Loading…</div>';m.hidden=false;
  const list=await listProjects();
  m.innerHTML=`<button data-act="new">New blank project</button><button data-act="sample">Open sample kitchen</button><button data-act="dupproj">Duplicate this project</button><hr>
    <div class="eyebrow" style="padding:6px 10px">Your projects</div><div class="pl">${list.map(p=>`<button data-act="open" data-id="${p.id}">${esc(p.name)} <span class="muted" style="font-size:11px">· ${new Date(p.updatedAt).toLocaleDateString()}</span></button>`).join('')||'<div class="hint" style="padding:6px 10px">None saved yet.</div>'}</div><hr>
    <button data-act="export">Save project file (.json)</button><button data-act="import">Open project file…</button><hr><button data-act="delproj" style="color:var(--err)">Delete this project…</button>`;
}
let confirmDel=0;
const ACT={
  tab:(el)=>{UI.tab=el.dataset.v;location.hash=UI.tab;render()},
  undo,redo,
  units:(el)=>{S.units=el.dataset.v;commit()},
  menu:()=>openMenu(),
  new:()=>{$('#menu').hidden=true;setProject(blankProject());UI.tab='measure';commit();toast('New project — start by measuring the walls')},
  sample:()=>{$('#menu').hidden=true;setProject(sampleProject());render();toast('Sample kitchen loaded')},
  dupproj:()=>{$('#menu').hidden=true;const p=clone(S);p.id=uid();p.name=S.name+' (copy)';setProject(p);commit();toast('Duplicated')},
  open:async(el)=>{$('#menu').hidden=true;const p=await loadProject(el.dataset.id);if(p){setProject(p);toast('Opened '+p.name)}else toast('Could not open that project','err')},
  export:()=>{$('#menu').hidden=true;saveFile((S.name||'kitchen').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')+'.json',JSON.stringify(S,null,1),'application/json')},
  import:()=>{$('#menu').hidden=true;$('#fileOpen').click()},
  delproj:async(el)=>{if(Date.now()-confirmDel>4000){confirmDel=Date.now();el.textContent='Tap again to delete “'+S.name+'”';return}
    $('#menu').hidden=true;const id=S.id;try{localStorage.removeItem('ps.p.'+id);const idx=localIndex();delete idx[id];LS.set('ps.index',idx)}catch(e){}
    if(CLOUD.ready){try{await CLOUD.db.collection('data/users/'+CLOUD.uid).doc(id).delete()}catch(e){}}
    const list=await listProjects();const nx=list[0]?await loadProject(list[0].id):null;setProject(nx||sampleProject());toast('Project deleted')},
  tmpl:(el)=>{if(el.dataset.v==='rect'){S.walls=[{len:144,note:''},{len:120,note:''},{len:144,note:''},{len:120,note:''}];S.corners=S.walls.map(()=>({ang:90}))}
    else{S.walls=[{len:168,note:''},{len:84,note:''},{len:60,note:''},{len:60,note:''},{len:108,note:''},{len:144,note:''}];S.corners=[{ang:90},{ang:90},{ang:270},{ang:90},{ang:90},{ang:90}]}
    S.items=S.items.filter(i=>i.wall==null||i.wall<S.walls.length);S.utils=S.utils.filter(u=>u.wall<S.walls.length);commit()},
  addwall:()=>{S.walls.push({len:96,note:''});S.corners.push({ang:90});commit()},
  delwall:(el)=>{const i=+el.dataset.i;if(S.walls.length<=3)return;S.walls.splice(i,1);S.corners.splice(i,1);S.items=S.items.filter(it=>it.wall!==i).map(it=>{if(it.wall!=null&&it.wall>i)it.wall--;return it});S.utils=S.utils.filter(u=>u.wall!==i).map(u=>{if(u.wall>i)u.wall--;return u});commit()},
  addutil:()=>{const t=$('#addUtilType').value;const T=UTIL[t];const u={id:uid(),type:t,wall:0,x:24,z:T.box?(t==='window'?42:t==='soffit'?0:0):(t==='gfci'||t==='outlet'?44:t==='sw'?48:t==='vent'?4:18),w:T.box?(t==='soffit'?48:36):0,h:T.box?(t==='window'?40:t==='door'?80:12):0,trim:t==='window'||t==='door'?3.5:0,note:''};S.utils.push(u);commit();setTimeout(()=>{const el=$('#m-ut_'+u.id+'_x');el&&el.focus()},30)},
  delutil:(el)=>{S.utils=S.utils.filter(u=>u.id!==el.dataset.id);commit()},
  laser:()=>laserConnect(),
  add:(el)=>{UI.wall=+$('#tgtWall').value||0;addItem(el.dataset.t)},
  fit:()=>{UI.view=null;drawPlan()},
  zoom:(el)=>{const svg=$('#plan');const v=svg.viewBox.baseVal;const k=+el.dataset.v;const cx=v.x+v.width/2,cy=v.y+v.height/2;UI.view={x:cx-v.width*k/2,y:cy-v.height*k/2,w:v.width*k,h:v.height*k};drawPlan()},
  tog:(el)=>{UI[el.dataset.v]=!UI[el.dataset.v];renderDesign()},
  desel:()=>{SEL=null;renderDesign()},
  nudge:(el)=>{const it=selItem();if(!it)return;it.x=r2(it.x+ +el.dataset.v);commit()},
  rot:(el)=>{const it=selItem();if(!it)return;it.rot=((it.rot||0)+ +el.dataset.v+360)%360;commit()},
  dup:()=>{const it=selItem();if(!it)return;const n=clone(it);n.id=uid();if(n.wall!=null){const gs=gaps(n.wall,n.z,n.z+n.h);const g=gs.find(g=>g.b-g.a>=n.w-0.01&&g.a>=it.x)||gs.find(g=>g.b-g.a>=n.w-0.01);n.x=g?g.a:it.x+it.w}else{n.cx+=12;n.cy-=12}S.items.push(n);SEL=n.id;commit()},
  del:()=>{S.items=S.items.filter(i=>i.id!==SEL);SEL=null;commit()},
  fillgap:(el)=>{fillGap(UI.wall,+el.dataset.a,+el.dataset.b,+el.dataset.z);commit()},
  autofill:()=>{const k=autofill(UI.wall);commit();toast(k?'Added '+k+' piece'+(k>1?'s':'')+' on W'+(UI.wall+1):'Nothing to fill on W'+(UI.wall+1))},
  goissue:(el)=>{const ids=el.dataset.ids.split(',').filter(Boolean);if(ids.length){SEL=ids[0];const it=selItem();if(it&&it.wall!=null)UI.wall=it.wall}UI.tab='design';location.hash='design';render()},
  elev:(el)=>{UI.elevWall=+el.dataset.v;renderElev()},
  dlsvg:()=>{const svg=$('#elsvg');const css=[...document.styleSheets].flatMap(s=>{try{return [...s.cssRules].map(r=>r.cssText).filter(t=>t.startsWith('.el'))}catch(e){return []}}).join('\n');
    const out=svg.outerHTML.replace('>',`><style>${css} text{font-family:monospace}</style><rect x="-30" y="-32" width="100%" height="100%" fill="#fff"/>`);saveFile('elevation-W'+(UI.elevWall+1)+'.svg',out,'image/svg+xml')},
  cam:(el)=>{setCam(el.dataset.v);render3DView()},
  light:(el)=>{S.settings.light=el.dataset.v;commit()},
  finish:(el)=>{S.settings[el.dataset.k]=el.dataset.v;commit()},
  est:(el)=>{UI.est=el.dataset.v;renderEstimate()},
  csvbom:()=>{const B=bom();saveFile('bom-'+slug()+'.csv',csv([['Group','SKU','Description','Qty','Unit','Unit cost','Extended'],...B.lines.map(l=>[l.grp,l.sku,l.desc,l.qty,l.unit,l.price,r2(l.qty*l.price)]),[],['','','Materials','','','',r2(B.mat)],['','','Labor','','','',r2(B.lab)],['','','Markup','','','',r2(B.mk)],['','','Tax','','','',r2(B.tax)],['','','Total','','','',r2(B.total)]]),'text/csv')},
  csvcut:()=>{const CL=cutlist();saveFile('cutlist-'+slug()+'.csv',csv([['Cabinet','Part','Qty','Width (in)','Length (in)','Material','Edge band'],...CL.parts.map(p=>[p.cab,p.part,p.qty,p.w,p.l,p.mat,p.eb?'Front':''])]),'text/csv')},
  csvfronts:()=>{const CL=cutlist();saveFile('fronts-'+slug()+'.csv',csv([['Cabinet','Front','Width (in)','Height (in)','Hinge','Finish'],...CL.fronts.map(f=>[f.cab,f.k,r2(f.w),r2(f.h),f.hinge||'',FINISH[S.settings.finish][0]])]),'text/csv')},
  copyorder:async()=>{const B=bom();const cab=B.lines.filter(l=>l.grp==='Cabinets'||l.grp==='Fillers & panels');const t=`Cabinet order — ${S.name}\nFinish: ${FINISH[S.settings.finish][0]} · Hardware: ${HW[S.settings.hw][0]}\n\n`+cab.map(l=>`${l.qty} × ${l.sku}  ${l.desc}`).join('\n')+`\n\nCountertop: ${COUNTER[S.settings.counter][0]}, ${B.sq.toFixed(1)} sq ft, ${B.lines.find(l=>l.sku==='CUT-SINK')?.qty||0} sink cutout(s)\n`;copyText(t,'Order summary copied — paste it into an email to your supplier')},
  dlquote:()=>{const B=bom();const html=`<!doctype html><html><head><meta charset="utf-8"><title>Proposal — ${esc(S.name)}</title><style>body{font-family:Helvetica,Arial,sans-serif;color:#1d2930;max-width:820px;margin:40px auto;padding:0 20px}h1{font-size:30px;margin:0 0 4px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px;border-bottom:1px solid #d8dcd8;text-align:left}.n{text-align:right;font-family:Menlo,monospace}.mono{font-family:Menlo,monospace}.sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px}.sig div{border-top:1px solid #1d2930;padding-top:6px;font-size:12px}</style></head><body>${proposalHTML(B)}</body></html>`;saveFile('proposal-'+slug()+'.html',html,'text/html')},
  copyquote:()=>copyText(proposalText(bom()),'Proposal copied as text'),
  print:()=>{$('#printArea').innerHTML='<div class="doc" style="border:0;max-width:none">'+proposalHTML(bom())+'</div>';window.print()}
};
const slug=()=>(S.name||'kitchen').toLowerCase().replace(/[^\w]+/g,'-').replace(/^-|-$/g,'');
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg)}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg)}catch(_){toast('Copy is blocked here — select the text manually','err')}ta.remove()}}

/* ---------- wiring ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){UI.tab=t.dataset.tab;location.hash=UI.tab;render();return}
  const a=e.target.closest('[data-act]');if(a&&!a.disabled){const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a)}return}
  if(!e.target.closest('#menu')&&!e.target.closest('#bMenu'))$('#menu').hidden=true;
});
document.addEventListener('change',e=>{if(e.target.id==='tgtWall'){UI.wall=+e.target.value;SEL=null;renderDesign();return}if(e.target.id==='fileOpen')return;onChange(e)});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('input.in')){NEXT_FOCUS=true;e.target.blur();if(document.activeElement===document.body)NEXT_FOCUS=NEXT_FOCUS;return}
  if(e.target.matches('input,select,textarea'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(UI.tab!=='design'||!SEL)return;const it=selItem();if(!it)return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();ACT.del();return}
  if(e.key==='Escape'){SEL=null;renderDesign();return}
  const step=e.shiftKey?1:0.125;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();if(it.wall!=null)it.x=r2(it.x+(e.key==='ArrowLeft'?-step:step));else it.cx=r2(it.cx+(e.key==='ArrowLeft'?-step:step));commit()}
  if((e.key==='ArrowUp'||e.key==='ArrowDown')&&it.wall==null){e.preventDefault();it.cy=r2(it.cy+(e.key==='ArrowUp'?step:-step));commit()}
});
$('#fileOpen').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(!p.walls||!p.items)throw 0;p.id=p.id||uid();setProject(p);commit();toast('Opened '+p.name)}catch(_){toast('That file is not a Plumb & Square project','err')}e.target.value=''});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==UI.tab&&$('#v-'+h)){UI.tab=h;render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&UI.tab==='view3d'&&!V3.raf&&V3.ready)loop3D()});

/* ---------- boot ---------- */
(function boot(){
  const h=location.hash.slice(1);if(h&&['measure','design','elevations','view3d','estimate','checks'].includes(h))UI.tab=h;
  const cur=LS.get('ps.current');const p=cur?LS.get('ps.p.'+cur):null;
  S=null;setProject(p?normalize(p):sampleProject());
  if(window.THREE){V3.orb.t=new THREE.Vector3();setCam('orbit')}
  if(S.sample)setSave('Sample project');
  initCloud();
})();
