# Evade Shaders - pack settings for Iris. This file is run through the preprocessor with the option values,
# so #ifdef/#if on option names works here.

# ----------------------------------------------------------------------------- vanilla features
oldLighting=false
separateAo=false
dynamicHandLight=false
underwaterOverlay=false
vignette=false
sun=false
stars=false
moon=true
sky=true
#if CLOUD_MODE == 1
clouds=fancy
#else
clouds=off
#endif
#ifdef SHADOWS
shadow.enabled=true
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowPlayer=true
shadowBlockEntities=true
#else
shadow.enabled=false
#endif
rain.depth=false
beacon.beam.depth=true
particles.ordering=mixed

# ----------------------------------------------------------------------------- passes
#ifndef VOLUMETRIC_LIGHT
program.composite1.enabled=false
program.composite2.enabled=false
#endif
#ifndef SHADOWS
program.composite1.enabled=false
program.composite2.enabled=false
#endif
#ifndef TAA
program.composite3.enabled=false
#endif
scale.composite1=0.5

# Translucent surface data must replace, not blend.
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_hand.colortex1=off
blend.gbuffers_hand_water.colortex1=off
blend.gbuffers_clouds.colortex1=off

# ----------------------------------------------------------------------------- profiles
# POTATO: about the cost of vanilla - better light, colour and tonemapping only.
profile.POTATO=!SHADOWS SKY_MODEL=0 !STARS CLOUD_MODE=1 !VOLUMETRIC_LIGHT !WATER_WAVES WATER_REFLECTIONS=1 \
 !WATER_REFRACTION !GLASS_REFLECTIONS !WATER_CAUSTICS !UNDERWATER_WOBBLE !WAVING_PLANTS !WAVING_LEAVES \
 !TAA SHARPENING=0.0 !BLOOM !COLORED_SHADOWS !FOLIAGE_TRANSLUCENCY !BORDER_FOG !END_NEBULA \
 shadowMapResolution=1024 shadowDistance=64.0 SHADOW_FILTER=0 SSR_STEPS=12 VL_SAMPLES=6
# LOW: integrated graphics (e.g. Radeon 780M) - cheap hard shadows, simple sky, simple water.
profile.LOW=SHADOWS shadowMapResolution=1024 shadowDistance=64.0 SHADOW_FILTER=0 !COLORED_SHADOWS \
 !FOLIAGE_TRANSLUCENCY SKY_MODEL=0 STARS CLOUD_MODE=1 !VOLUMETRIC_LIGHT WATER_WAVES WATER_REFLECTIONS=1 \
 !WATER_REFRACTION !GLASS_REFLECTIONS !WATER_CAUSTICS UNDERWATER_WOBBLE WAVING_PLANTS !WAVING_LEAVES !TAA \
 SHARPENING=0.0 !BLOOM BORDER_FOG END_NEBULA SSR_STEPS=12 VL_SAMPLES=6
# MEDIUM: soft (PCF) shadows, scattering sky, 2D clouds, screen-space water reflections, bloom, TAA.
profile.MEDIUM=SHADOWS shadowMapResolution=1536 shadowDistance=96.0 SHADOW_FILTER=1 !COLORED_SHADOWS \
 !FOLIAGE_TRANSLUCENCY SKY_MODEL=1 STARS CLOUD_MODE=2 !VOLUMETRIC_LIGHT WATER_WAVES WATER_REFLECTIONS=2 \
 WATER_REFRACTION !GLASS_REFLECTIONS !WATER_CAUSTICS UNDERWATER_WOBBLE WAVING_PLANTS WAVING_LEAVES TAA \
 SHARPENING=0.35 BLOOM BORDER_FOG END_NEBULA SSR_STEPS=16 VL_SAMPLES=8
# HIGH: contact-hardening (PCSS) shadows, coloured shadows, god rays, glass reflections.
profile.HIGH=SHADOWS shadowMapResolution=2048 shadowDistance=128.0 SHADOW_FILTER=2 COLORED_SHADOWS \
 FOLIAGE_TRANSLUCENCY SKY_MODEL=1 STARS CLOUD_MODE=2 VOLUMETRIC_LIGHT WATER_WAVES WATER_REFLECTIONS=2 \
 WATER_REFRACTION GLASS_REFLECTIONS WATER_CAUSTICS UNDERWATER_WOBBLE WAVING_PLANTS WAVING_LEAVES TAA \
 SHARPENING=0.35 BLOOM BORDER_FOG END_NEBULA SSR_STEPS=24 VL_SAMPLES=8
# ULTRA: bigger shadow map, volumetric clouds, more god-ray and reflection samples.
profile.ULTRA=SHADOWS shadowMapResolution=3072 shadowDistance=192.0 SHADOW_FILTER=2 COLORED_SHADOWS \
 FOLIAGE_TRANSLUCENCY SKY_MODEL=1 STARS CLOUD_MODE=3 VOLUMETRIC_LIGHT WATER_WAVES WATER_REFLECTIONS=2 \
 WATER_REFRACTION GLASS_REFLECTIONS WATER_CAUSTICS UNDERWATER_WOBBLE WAVING_PLANTS WAVING_LEAVES TAA \
 SHARPENING=0.35 BLOOM BORDER_FOG END_NEBULA SSR_STEPS=32 VL_SAMPLES=16

# ----------------------------------------------------------------------------- options screen
screen=<profile> <empty> [SHADOWS_SCREEN] [LIGHTING_SCREEN] [SKY_SCREEN] [WATER_SCREEN] [FOLIAGE_SCREEN] [POST_SCREEN] [DIMENSION_SCREEN]
screen.columns=1
screen.SHADOWS_SCREEN=SHADOWS SHADOW_FILTER shadowMapResolution shadowDistance SHADOW_SOFTNESS COLORED_SHADOWS sunPathRotation
screen.LIGHTING_SCREEN=SUNLIGHT_STRENGTH WARM_BLOCKLIGHT EMISSIVE_BLOCKS EMISSIVE_STRENGTH FOLIAGE_TRANSLUCENCY
screen.SKY_SCREEN=SKY_MODEL STARS CLOUD_MODE CLOUD_COVERAGE VOLUMETRIC_LIGHT VL_SAMPLES VL_STRENGTH FOG_DENSITY BORDER_FOG
screen.WATER_SCREEN=WATER_WAVES WAVE_HEIGHT WATER_REFLECTIONS SSR_STEPS WATER_REFRACTION GLASS_REFLECTIONS WATER_CAUSTICS UNDERWATER_WOBBLE
screen.FOLIAGE_SCREEN=WAVING_PLANTS WAVING_LEAVES WIND_STRENGTH
screen.POST_SCREEN=TAA SHARPENING BLOOM BLOOM_STRENGTH TONEMAP EXPOSURE SATURATION CONTRAST VIGNETTE VIGNETTE_STRENGTH
screen.DIMENSION_SCREEN=NETHER_HAZE END_NEBULA

sliders=shadowMapResolution shadowDistance SHADOW_SOFTNESS sunPathRotation SUNLIGHT_STRENGTH EMISSIVE_STRENGTH \
 CLOUD_COVERAGE VL_SAMPLES VL_STRENGTH FOG_DENSITY WAVE_HEIGHT SSR_STEPS WIND_STRENGTH SHARPENING BLOOM_STRENGTH \
 EXPOSURE SATURATION CONTRAST VIGNETTE_STRENGTH
