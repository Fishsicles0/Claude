# Evade CI: on every push and pull request, compile the mod, the launcher and Evade Clips, run the unit tests,
# the social worker's tests and the Clips self-test. Needs no secrets: everything runs offline against fakes,
# except dependency downloads (Maven, Fabric, npm-free Node) and ffmpeg from Ubuntu's packages.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the mod and its in-game tests
        run: ./gradlew compileJava compileGametestJava --no-daemon
      - name: Compile the launcher and Evade Clips
        # :installer:compileJava also checks build.gradle and LauncherInfo.VERSION agree
        run: ./gradlew :installer:compileJava :clips:compileJava --no-daemon
      - name: Unit tests (launcher and Clips)
        run: ./gradlew :installer:test :clips:test --no-daemon
      - name: Mod jar
        run: ./gradlew :remapJar --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            installer/build/reports/tests/test
            clips/build/reports/tests/test
          if-no-files-found: ignore

  worker:
    name: Social worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # node:sqlite stands in for the Durable Object storage
      - name: worker/test/social.test.mjs
        run: node worker/test/social.test.mjs

  clips-selftest:
    name: Evade Clips self-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: ffmpeg and a virtual screen
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg xvfb
      - name: Record, save, edit and export through ffmpeg
        # Voice-command and share-link checks are skipped without a speech model or a share server (no secrets here).
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :clips:selfTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: clips-selftest
          path: clips/build/selftest
          if-no-files-found: ignore
