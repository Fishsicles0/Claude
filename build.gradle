plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
}

dependencies {
    // Pure-Java H.264/MP4 encoder for Clips, bundled inside the mod jar.
    include(implementation("org.jcodec:jcodec:0.2.5"))
    // Pure-Java Opus codec for voice chat (no native libraries), bundled inside the mod jar.
    include(implementation("io.github.jaredmdobson:concentus:1.0.2"))
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar { from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }

// In-game tests: `xvfb-run ./gradlew runClientGameTest` launches Minecraft, builds a world,
// exercises every module and saves screenshots to build/run/clientGameTest/screenshots.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "evade-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// Evade cancels, holds back and sends packets itself at the connection level (Blink, NoFall, rotations). Fabric's
// gametest network synchroniser can't account for that and stalls for 10 s at random, as its own error message
// says ("Detected interfacing with packets at a lower level ... disable network synchronization"). Client and
// server still advance tick by tick; only the per-tick wait for in-flight packets is skipped.
loom.runs.matching { it.name == 'clientGameTest' }.configureEach {
    vmArg "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
}

// Litematica + MaLiLib for the in-game Printer test only (scripts/fetch-test-mods.py downloads them).
// Fabric Loader loads them at launch for the test run; they are never part of the Evade jar.
afterEvaluate {
    def testMods = fileTree(dir: 'libs/test-mods', include: '*.jar').files
    if (!testMods.isEmpty()) {
        loom.runs.matching { it.name == 'clientGameTest' }.configureEach {
            vmArg "-Dfabric.addMods=${testMods.collect { it.absolutePath }.join(File.pathSeparator)}"
        }
    }
}
