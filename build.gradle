plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
}

// Compile-only stand-ins for the Simple Voice Chat API (see src/svcstub/README.md): replays record and play back
// voice chat when that mod is installed. Never packaged; the real classes come from Simple Voice Chat at runtime.
sourceSets { svcstub { java.srcDir 'src/svcstub/java' } }

dependencies {
    // Pure-Java H.264/MP4 encoder for Clips, bundled inside the mod jar.
    include(implementation("org.jcodec:jcodec:0.2.5"))
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly sourceSets.svcstub.output
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar { from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }

// In-game tests: `xvfb-run ./gradlew runClientGameTest` launches Minecraft, builds a world, checks what the
// modules, HUD, menu, commands and profiles do (and that no module crashed during the run), and saves
// screenshots to build/run/clientGameTest/screenshots.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "evade-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// Fabric's gametest network synchroniser stalled for 10 s at random in this suite ("Detected interfacing with
// packets at a lower level ... disable network synchronization"). Client and server still advance tick by tick;
// only the per-tick wait for in-flight packets is skipped.
loom.runs.matching { it.name == 'clientGameTest' }.configureEach {
    vmArg "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
    // `-Pfootage` films gameplay for the Evade Clips screenshots instead of testing (scripts/film-footage.sh)
    // `-PmenuShot` only opens the menu in each theme and screenshots it (quick look at GUI changes)
    if (project.hasProperty('menuShot')) vmArg "-Devade.menushot=true"
    if (project.hasProperty('replayTest')) vmArg "-Devade.replaytest=true"
    if (project.hasProperty('footage')) {
        vmArg "-Devade.footage=true"
        vmArg "-Devade.footage.dir=${layout.buildDirectory.dir('footage').get().asFile.absolutePath}"
        vmArg "-Devade.footage.only=${project.findProperty('footage') ?: ''}"
    }
}

// Simple Voice Chat for the in-game integration test only (scripts/fetch-test-mods.py downloads it from Modrinth).
// Fabric Loader loads it at launch for the test run; it is never part of the Evade jar.
afterEvaluate {
    def testMods = fileTree(dir: 'libs/test-mods', include: '*.jar').files
    if (!testMods.isEmpty()) {
        loom.runs.matching { it.name == 'clientGameTest' }.configureEach {
            vmArg "-Dfabric.addMods=${testMods.collect { it.absolutePath }.join(File.pathSeparator)}"
        }
    }
}
